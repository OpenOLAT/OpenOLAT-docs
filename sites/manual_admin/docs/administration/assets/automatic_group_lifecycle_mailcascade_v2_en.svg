<svg width="857" height="506" viewBox="0 0 857 506" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    .lbl { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #000000; }
    .edge { stroke: #666666; stroke-width: 1; fill: none; }
    .elbl { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #000000; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect class="box" x="12" y="8" width="203" height="62" rx="14" ry="14"/>
  <text class="lbl" x="113.5" y="33" text-anchor="middle">life cycle creates</text>
  <text class="lbl" x="113.5" y="49" text-anchor="middle">automatic notification</text>

  <line class="edge" x1="113.5" y1="70" x2="113.5" y2="140" marker-end="url(#arrow)"/>

  <polygon class="box" points="113.5,145 216,190 113.5,235 11,190"/>
  <text class="lbl" x="113.5" y="185" text-anchor="middle">group coach</text>
  <text class="lbl" x="113.5" y="201" text-anchor="middle">available?</text>

  <text class="elbl" x="232" y="180">yes</text>
  <line class="edge" x1="216" y1="190" x2="299" y2="190" marker-end="url(#arrow)"/>
  <rect class="box" x="300" y="152" width="211" height="78"/>
  <text class="lbl" x="405.5" y="185" text-anchor="middle">mail to all</text>
  <text class="lbl" x="405.5" y="201" text-anchor="middle">group coaches</text>

  <text class="elbl" x="78" y="266">no</text>
  <path class="edge" d="M 113.5 235 L 113.5 348 L 305 348" marker-end="url(#arrow)"/>

  <polygon class="box" points="410,303 513,348 410,393 307,348"/>
  <text class="lbl" x="410" y="343" text-anchor="middle">group belongs to</text>
  <text class="lbl" x="410" y="359" text-anchor="middle">a course?</text>

  <text class="elbl" x="516" y="337">yes</text>
  <line class="edge" x1="513" y1="348" x2="539" y2="348" marker-end="url(#arrow)"/>
  <rect class="box" x="540" y="308" width="201" height="78"/>
  <text class="lbl" x="640.5" y="341" text-anchor="middle">mail to all</text>
  <text class="lbl" x="640.5" y="357" text-anchor="middle">course owners</text>

  <text class="elbl" x="381" y="409">no</text>
  <path class="edge" d="M 410 393 L 410 462 L 654 462" marker-end="url(#arrow)"/>
  <rect class="box" x="655" y="425" width="200" height="72"/>
  <text class="lbl" x="755" y="466" text-anchor="middle">no notification</text>
</svg>
