<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="t d">
  <title id="t">Login procedures in OpenOlat and where they are set up</title>
  <desc id="d">Authentication comprises the OpenOlat password, cloud login, LDAP and Shibboleth. LDAP and Shibboleth require the server configuration, after that they appear in the system administration in the menu Login. System administrators set up the OpenOlat password and cloud login directly in the menu Login.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F5456"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="460" fill="#FFFFFF"/>

  <!-- Titel -->
  <text x="20" y="34" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#342C24">Login procedures and where they are set up</text>

  <!-- Oberbegriff -->
  <rect x="456" y="54" width="200" height="44" rx="10" fill="#126365"/>
  <text x="556" y="82" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Authentication</text>

  <!-- Verbindungslinien zu den Verfahren -->
  <g stroke="#0F5456" stroke-width="1.5" fill="none">
    <path d="M556,98 L556,114 L270,114 L270,134"/>
    <path d="M556,114 L457,114 L457,134"/>
    <path d="M556,114 L645,114 L645,134"/>
    <path d="M556,114 L832,114 L832,134"/>
  </g>

  <!-- Verfahren -->
  <g font-family="'Roboto', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="185" y="134" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="2"/>
    <text x="270" y="161" fill="#126365">OpenOlat password</text>
    <rect x="372" y="134" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="2"/>
    <text x="457" y="161" fill="#126365">Cloud login</text>
    <rect x="560" y="134" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="2"/>
    <text x="645" y="161" fill="#126365">LDAP</text>
    <rect x="747" y="134" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="2"/>
    <text x="832" y="161" fill="#126365">Shibboleth</text>
  </g>

  <!-- Bahn 1: Serverkonfiguration -->
  <rect x="10" y="200" width="920" height="84" rx="10" fill="#126365" fill-opacity="0.12"/>
  <text x="22" y="226" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" fill="#342C24">Server configuration</text>
  <text x="22" y="245" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Operator of the installation,</text>
  <text x="22" y="260" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">for frentix customers</text>
  <text x="22" y="275" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">the customer advisor</text>

  <g font-family="'Roboto', sans-serif" font-size="13" text-anchor="middle">
    <text x="270" y="247" fill="#2D2926">not needed</text>
    <text x="457" y="247" fill="#2D2926">not needed</text>
    <rect x="560" y="212" width="170" height="60" rx="8" fill="#F2AF40"/>
    <text x="645" y="237" fill="#2D2926" font-weight="700">Switch on LDAP</text>
    <text x="645" y="256" fill="#2D2926">Connection to the directory</text>
    <rect x="747" y="212" width="170" height="60" rx="8" fill="#F2AF40"/>
    <text x="832" y="237" fill="#2D2926" font-weight="700">Switch on Shibboleth</text>
    <text x="832" y="256" fill="#2D2926">Basic configuration</text>
  </g>

  <!-- Bahn 2: Administration > Login -->
  <rect x="10" y="300" width="920" height="84" rx="10" fill="#126365" fill-opacity="0.12"/>
  <text x="22" y="336" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" fill="#342C24">Administration</text>
  <text x="22" y="356" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Menu Login</text>

  <g font-family="'Roboto', sans-serif" font-size="13" text-anchor="middle">
    <rect x="185" y="312" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="1.5"/>
    <text x="270" y="337" fill="#126365" font-weight="700">Password and</text>
    <text x="270" y="356" fill="#126365" font-weight="700">authentication</text>
    <rect x="372" y="312" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="1.5"/>
    <text x="457" y="337" fill="#126365" font-weight="700">Cloud login</text>
    <text x="457" y="356" fill="#2D2926">Add provider</text>
    <rect x="560" y="312" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="1.5"/>
    <text x="645" y="337" fill="#126365" font-weight="700">LDAP</text>
    <text x="645" y="356" fill="#2D2926">Synchronization, accounts</text>
    <rect x="747" y="312" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="1.5"/>
    <text x="832" y="337" fill="#126365" font-weight="700">Shibboleth</text>
    <text x="832" y="356" fill="#2D2926">Attribute access control</text>
  </g>

  <!-- Pfeile: Serverkonfiguration macht den Menüeintrag sichtbar -->
  <g stroke="#0F5456" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M645,272 L645,310"/>
    <path d="M832,272 L832,310"/>
    <path d="M270,256 L270,310" stroke-dasharray="4 4"/>
    <path d="M457,256 L457,310" stroke-dasharray="4 4"/>
  </g>
  <g stroke="#0F5456" stroke-width="1.5" fill="none">
    <path d="M270,178 L270,232" stroke-dasharray="4 4"/>
    <path d="M457,178 L457,232" stroke-dasharray="4 4"/>
    <path d="M645,178 L645,212"/>
    <path d="M832,178 L832,212"/>
  </g>
  <text x="740" y="295" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="11" fill="#0F5456">only then visible in the menu</text>

  <!-- Fusszeile: Sicht auf ein einzelnes Konto -->
  <rect x="10" y="402" width="920" height="44" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="1"/>
  <text x="22" y="429" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Login procedures of a single account: <tspan font-weight="700" fill="#126365">User management &gt; "Account of the person" &gt; Tab "Authentications"</tspan></text>
</svg>
