<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 530" width="1020" height="530" role="img" aria-label="Fünf Einstiege führen auf dieselbe Liste der Durchführungen und von dort in die Struktur">
  <rect x="0" y="0" width="1020" height="530" fill="#F3F4EF"/>

  <text x="30" y="46" font-family="'Roboto', sans-serif" font-size="26" font-weight="700" fill="#135E5F">Fünf Einstiege, eine Liste</text>
  <text x="30" y="76" font-family="'Roboto', sans-serif" font-size="18" fill="#2D2926">Alle Einstiege zeigen dieselbe Liste. Nur Filter und Spalten sind je Bereich anders gesetzt.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#135E5F"/>
    </marker>
  </defs>

  <!-- Einstiegspunkte -->
  <text x="30" y="122" font-family="'Roboto', sans-serif" font-size="18" font-weight="700" fill="#135E5F">Einstiegspunkte</text>

  <g font-family="'Roboto', sans-serif" font-size="17" fill="#2D2926">
    <rect x="30" y="136" width="330" height="58" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
    <text x="48" y="162">Kurse &gt; Bildungsprodukte</text>
    <text x="48" y="183" font-size="15" fill="#A6A6A6">Teilnehmer:in</text>

    <rect x="30" y="206" width="330" height="58" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
    <text x="48" y="232">Coaching &gt; Bildungsprodukte</text>
    <text x="48" y="253" font-size="15" fill="#A6A6A6">Betreuer:in, Kursbesitzer:in</text>

    <rect x="30" y="276" width="330" height="58" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
    <text x="48" y="302">Coaching &gt; Personen &gt; Person</text>
    <text x="48" y="323" font-size="15" fill="#A6A6A6">als Betreuer:in oder Kursbesitzer:in</text>

    <rect x="30" y="346" width="330" height="58" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
    <text x="48" y="372">Coaching &gt; Personen &gt; Person</text>
    <text x="48" y="393" font-size="15" fill="#A6A6A6">als Linienvorgesetzte:r, Ausbildungsverantw.</text>

    <rect x="30" y="416" width="330" height="76" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
    <text x="48" y="442">Benutzerverwaltung &gt; Person</text>
    <text x="48" y="463" font-size="15" fill="#A6A6A6">Benutzerverwalter:in, Rollenverwalter:in,</text>
    <text x="48" y="482" font-size="15" fill="#A6A6A6">Administrator:in, Principal</text>
  </g>

  <!-- Pfeile zur gemeinsamen Liste -->
  <g stroke="#135E5F" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 360 165 L 400 250"/>
    <path d="M 360 235 L 400 270"/>
    <path d="M 360 305 L 400 300"/>
    <path d="M 360 375 L 400 330"/>
    <path d="M 360 445 L 400 350"/>
  </g>

  <!-- Gemeinsame Liste -->
  <rect x="410" y="200" width="290" height="200" rx="10" fill="#209D9E"/>
  <text x="430" y="238" font-family="'Roboto', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Liste der Durchführungen</text>
  <g font-family="'Roboto', sans-serif" font-size="16" fill="#FFFFFF">
    <text x="430" y="272">Gleiche Vorauswahl-Filter</text>
    <text x="430" y="298">Gleiche Spaltenbedeutung</text>
    <text x="430" y="324">Suche über Titel und Kennzeichen</text>
    <text x="430" y="360" font-size="15">Pro Bereich ist gesetzt, welche</text>
    <text x="430" y="380" font-size="15">Filter und Spalten es gibt.</text>
  </g>

  <path d="M 700 300 L 750 300" stroke="#135E5F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="725" y="276" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926" text-anchor="middle">Klick auf</text>
  <text x="725" y="291" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926" text-anchor="middle">Titel</text>

  <!-- Struktur -->
  <rect x="760" y="230" width="230" height="140" rx="10" fill="#FFFFFF" stroke="#135E5F" stroke-width="2"/>
  <text x="778" y="266" font-family="'Roboto', sans-serif" font-size="19" font-weight="700" fill="#135E5F">Struktur der</text>
  <text x="778" y="290" font-family="'Roboto', sans-serif" font-size="19" font-weight="700" fill="#135E5F">Durchführung</text>
  <g font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">
    <text x="778" y="322">Enthaltene Kurse</text>
    <text x="778" y="346">Spalte "Öffnen"</text>
  </g>

  <!-- Abgrenzung -->
  <rect x="410" y="430" width="580" height="76" rx="8" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="430" y="458" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#A6A6A6">Nicht Teil dieser Ansicht</text>
  <text x="430" y="484" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">Course Planner &gt; Durchführungen: eigene Verwaltungssicht für die Planung.</text>
  <text x="990" y="516" font-family="'Roboto', sans-serif" font-size="11" fill="#A6A6A6" text-anchor="end">OpenOlat ∞</text>
</svg>
