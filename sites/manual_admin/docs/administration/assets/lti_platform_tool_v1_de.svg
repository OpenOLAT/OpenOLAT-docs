<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="OpenOlat als Tool stellt einen Kurs für die Plattform eines anderen LMS bereit, OpenOlat als Plattform nutzt den Inhalt eines Tools aus einem anderen LMS">
  <title>Rollen Tool und Plattform zwischen zwei Systemen</title>
<rect x="0" y="0" width="760" height="420" fill="#F3F4EF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#126365"/></marker></defs>

<rect x="20" y="20" width="250" height="380" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="2.5"/>
<text x="145" y="56" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#126365">OpenOlat</text>
<rect x="55" y="96" width="180" height="110" rx="8" fill="#126365"/>
<text x="145" y="157" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Tool</text>
<rect x="55" y="250" width="180" height="110" rx="8" fill="#E3EFEF" stroke="#126365" stroke-width="2"/>
<text x="145" y="311" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#2D2926">Plattform</text>

<rect x="490" y="20" width="250" height="380" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="2.5"/>
<text x="615" y="56" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#126365">Anderes LMS</text>
<rect x="525" y="96" width="180" height="110" rx="8" fill="#E3EFEF" stroke="#126365" stroke-width="2"/>
<text x="615" y="157" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#2D2926">Plattform</text>
<rect x="525" y="250" width="180" height="110" rx="8" fill="#126365"/>
<text x="615" y="311" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Tool</text>

<text x="380" y="106" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">OpenOlat-Kurs wird</text>
<text x="380" y="124" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">als <tspan font-weight="700">Tool</tspan> in einem</text>
<text x="380" y="142" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">anderen LMS genutzt</text>
<path d="M 239 160 L 519 160" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>

<text x="380" y="260" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">Inhalt aus einem anderen</text>
<text x="380" y="278" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">LMS wird in OpenOlat</text>
<text x="380" y="296" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">als <tspan font-weight="700">Plattform</tspan> genutzt</text>
<path d="M 521 314 L 241 314" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
