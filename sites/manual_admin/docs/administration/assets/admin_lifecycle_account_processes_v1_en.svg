<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" role="img" aria-label="Account expiration and automatic user lifecycle as two independent processes">
  <title>Account expiration and automatic user lifecycle</title>
  <rect x="0" y="0" width="980" height="660" fill="#F3F4EF"/>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#135E5F"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F2AF40"/>
    </marker>
  </defs>

  <text x="40" y="50" font-family="'Roboto', sans-serif" font-size="26" font-weight="700" fill="#135E5F">Account expiration and automatic user lifecycle</text>
  <text x="40" y="78" font-family="'Roboto', sans-serif" font-size="17" fill="#2D2926">Two independent processes. Whichever occurs first takes effect.</text>

  <!-- Prozess A -->
  <rect x="40" y="104" width="420" height="150" rx="10" fill="#FFFFFF" stroke="#209D9E" stroke-width="3"/>
  <rect x="40" y="104" width="420" height="38" rx="10" fill="#209D9E"/>
  <text x="60" y="130" font-family="'Roboto', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Account expiration</text>
  <text x="60" y="168" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" fill="#2D2926">Trigger: date stored on the account</text>
  <text x="60" y="192" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">Set per account, e.g. for fixed-term access.</text>
  <text x="60" y="214" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">Shown in the "Account" tab: Days until expiry.</text>
  <text x="60" y="236" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">Not available for administrator and guest accounts.</text>

  <!-- Prozess B -->
  <rect x="520" y="104" width="420" height="150" rx="10" fill="#FFFFFF" stroke="#135E5F" stroke-width="3"/>
  <rect x="520" y="104" width="420" height="38" rx="10" fill="#135E5F"/>
  <text x="540" y="130" font-family="'Roboto', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Automatic user lifecycle</text>
  <text x="540" y="168" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" fill="#2D2926">Trigger: last login</text>
  <text x="540" y="192" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">System-wide periods, no entry on the account.</text>
  <text x="540" y="214" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">Two toggles: deactivate accounts, delete accounts.</text>
  <text x="540" y="236" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">If they are off, the periods disappear entirely.</text>

  <line x1="250" y1="254" x2="250" y2="300" stroke="#209D9E" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="730" y1="254" x2="730" y2="300" stroke="#135E5F" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="490" y="288" font-family="'Roboto', sans-serif" font-size="16" font-style="italic" fill="#2D2926" text-anchor="middle">both act on the same account status</text>

  <!-- Zustandskette -->
  <text x="40" y="336" font-family="'Roboto', sans-serif" font-size="19" font-weight="700" fill="#135E5F">States of an account</text>

  <rect x="40" y="354" width="200" height="112" rx="8" fill="#FFFFFF" stroke="#B2CF42" stroke-width="3"/>
  <rect x="40" y="354" width="200" height="34" rx="8" fill="#B2CF42"/>
  <text x="140" y="378" font-family="'Roboto', sans-serif" font-size="18" font-weight="700" fill="#2D2926" text-anchor="middle">Active</text>
  <text x="140" y="410" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">Last login</text>
  <text x="140" y="434" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">Days until</text>
  <text x="140" y="454" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">inactivation</text>

  <rect x="288" y="354" width="220" height="112" rx="8" fill="#FFFFFF" stroke="#F2AF40" stroke-width="3"/>
  <rect x="288" y="354" width="220" height="34" rx="8" fill="#F2AF40"/>
  <text x="398" y="378" font-family="'Roboto', sans-serif" font-size="18" font-weight="700" fill="#2D2926" text-anchor="middle">Reactivated</text>
  <text x="398" y="410" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">Reactivation date</text>
  <text x="398" y="434" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">Days until inactivation</text>
  <text x="398" y="454" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">with "(grace period)"</text>

  <rect x="556" y="354" width="200" height="112" rx="8" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="3"/>
  <rect x="556" y="354" width="200" height="34" rx="8" fill="#A6A6A6"/>
  <text x="656" y="378" font-family="'Roboto', sans-serif" font-size="18" font-weight="700" fill="#2D2926" text-anchor="middle">Inactive</text>
  <text x="656" y="410" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">Inactivation date</text>
  <text x="656" y="434" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">Days until</text>
  <text x="656" y="454" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">deletion</text>

  <rect x="804" y="354" width="136" height="112" rx="8" fill="#FFFFFF" stroke="#8F1F40" stroke-width="3"/>
  <rect x="804" y="354" width="136" height="34" rx="8" fill="#8F1F40"/>
  <text x="872" y="378" font-family="'Roboto', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Deleted</text>
  <text x="872" y="416" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">Account is</text>
  <text x="872" y="438" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">anonymised</text>

  <line x1="284" y1="410" x2="244" y2="410" stroke="#F2AF40" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="264" y="486" font-family="'Roboto', sans-serif" font-size="15" fill="#2D2926" text-anchor="middle">after the grace period</text>
  <line x1="508" y1="410" x2="552" y2="410" stroke="#135E5F" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="756" y1="410" x2="800" y2="410" stroke="#135E5F" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- Fussnote -->
  <rect x="40" y="496" width="900" height="132" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
  <text x="60" y="524" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#135E5F">Where the entries appear</text>
  <text x="60" y="552" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">Administration &gt; Life cycles &gt; User: configure both processes, with daily run time.</text>
  <text x="60" y="576" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">User management &gt; Account &gt; "Account" tab: state and periods for a single account.</text>
  <text x="60" y="600" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926">User management &gt; search result: the same periods as columns for many accounts.</text>
  <text x="60" y="620" font-family="'Roboto', sans-serif" font-size="15" font-style="italic" fill="#2D2926">The columns "Days until inactivation" and "Days until deletion" are absent when the matching toggle is off.</text>
</svg>
