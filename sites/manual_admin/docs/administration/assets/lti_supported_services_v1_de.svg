<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" role="img" aria-label="LTI-Dienste in beiden Richtungen: OpenOlat als Plattform unterstützt Start, Punkte, Mitgliederliste und Inhaltsauswahl, OpenOlat als Tool unterstützt Start und Punkte">
  <title>LTI-Dienste in OpenOlat</title>
<rect x="0" y="0" width="940" height="600" fill="#F3F4EF"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#126365"/></marker>
  <marker id="arrowgrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A6A6A6"/></marker>
</defs>
<text x="30" y="46" font-family="'Roboto', sans-serif" font-size="24" font-weight="700" fill="#126365">LTI-Dienste in OpenOlat (LTI 1.3)</text>
<text x="30" y="74" font-family="'Roboto', sans-serif" font-size="15" fill="#2D2926">Der Pfeil zeigt die Richtung der Daten. Grau und gestrichelt: nicht unterstützt.</text>

<!-- Links: OpenOlat als Plattform -->
<rect x="30" y="94" width="430" height="424" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="2.5"/>
<text x="48" y="126" font-family="'Roboto', sans-serif" font-size="18" font-weight="700" fill="#126365">OpenOlat als Plattform</text>
<text x="48" y="148" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">Ein Kursbaustein bindet ein externes Tool ein</text>
<rect x="46" y="166" width="112" height="252" rx="8" fill="#126365"/>
<text x="102" y="282" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">OpenOlat</text>
<text x="102" y="304" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#FFFFFF">Kursbaustein</text>
<text x="102" y="321" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#FFFFFF">«LTI-Seite»</text>
<rect x="332" y="166" width="112" height="252" rx="8" fill="#E3EFEF" stroke="#126365" stroke-width="2"/>
<text x="388" y="290" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" fill="#2D2926">Externes</text>
<text x="388" y="310" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" fill="#2D2926">Tool</text>

<text x="245" y="200" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926">Start</text>
<path d="M 162 210 L 326 210" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="245" y="228" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Resource Link Launch</text>

<text x="245" y="258" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926">Punkte</text>
<path d="M 328 268 L 164 268" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="245" y="286" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Bewertungsdienst (AGS)</text>

<text x="245" y="316" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926">Mitgliederliste</text>
<path d="M 162 326 L 326 326" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="245" y="344" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">NRPS 2.0</text>

<text x="245" y="374" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926">Inhaltsauswahl</text>
<path d="M 328 384 L 164 384" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="245" y="402" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Deep Linking 2.0</text>

<text x="48" y="446" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Punkte: nur mit «Punkte übertragen» im Kursbaustein</text>
<text x="48" y="465" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Mitgliederliste: die Teilnehmer:innen des Kurses</text>
<text x="48" y="484" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Inhaltsauswahl: bei «LTI 1.3» und bei vorkonfigurierten</text>
<text x="48" y="503" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Tools mit «Deep-Linking aktivieren»</text>

<!-- Rechts: OpenOlat als Tool -->
<rect x="480" y="94" width="430" height="424" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="2.5"/>
<text x="498" y="126" font-family="'Roboto', sans-serif" font-size="18" font-weight="700" fill="#126365">OpenOlat als Tool</text>
<text x="498" y="148" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">Ein Kurs oder eine Gruppe für eine externe Plattform</text>
<rect x="496" y="166" width="112" height="252" rx="8" fill="#126365"/>
<text x="552" y="282" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">OpenOlat</text>
<text x="552" y="304" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#FFFFFF">LTI-Freigabe</text>
<text x="552" y="321" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#FFFFFF">Kurs oder Gruppe</text>
<rect x="782" y="166" width="112" height="252" rx="8" fill="#E3EFEF" stroke="#126365" stroke-width="2"/>
<text x="838" y="282" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" fill="#2D2926">Externe</text>
<text x="838" y="302" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" fill="#2D2926">Plattform</text>
<text x="838" y="324" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">z. B. Moodle</text>

<text x="695" y="200" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926">Start</text>
<path d="M 778 210 L 614 210" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="695" y="228" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Resource Link Launch</text>

<text x="695" y="258" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926">Punkte</text>
<path d="M 612 268 L 776 268" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="695" y="286" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Bewertungsdienst (AGS)</text>

<text x="695" y="316" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#A6A6A6">Mitgliederliste</text>
<path d="M 778 326 L 614 326" fill="none" stroke="#A6A6A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowgrey)"/>
<text x="695" y="344" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#8F1F40">nicht abgefragt</text>

<text x="695" y="374" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#A6A6A6">Inhaltsauswahl</text>
<path d="M 612 384 L 776 384" fill="none" stroke="#A6A6A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowgrey)"/>
<text x="695" y="402" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="12" fill="#8F1F40">nicht unterstützt</text>

<text x="498" y="446" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Start: für Kurse und Gruppen, Konto beim ersten Aufruf</text>
<text x="498" y="465" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Punkte: Ergebnis des ganzen Kurses, nur aus Kursen</text>
<text x="498" y="484" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Mitgliederliste: Adresse gespeichert, Dienst nicht</text>
<text x="498" y="503" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">abgefragt</text>

<!-- LTI 1.0 / 1.1 -->
<rect x="30" y="534" width="880" height="44" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="48" y="561" font-family="'Roboto', sans-serif" font-size="13.5" fill="#2D2926"><tspan font-weight="700" fill="#126365">LTI 1.0 / 1.1</tspan> (nur OpenOlat als Plattform): Start mit «Schlüssel» und «Passwort», Punkte als Wert von 0 bis 1 (Basic Outcomes)</text>
</svg>
