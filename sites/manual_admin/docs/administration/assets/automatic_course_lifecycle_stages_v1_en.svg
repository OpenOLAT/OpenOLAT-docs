<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="Three steps of the automatic course life cycle">
<rect width="780" height="330" fill="#F3F4EF"/>
<text x="390" y="34" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="19" font-weight="600" fill="#2D2926">Automatic course life cycle: three steps</text>
<text x="390" y="56" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#A6A6A6">The daily run moves courses one step further once the configured period has passed</text>

<rect x="30" y="86" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
<rect x="30" y="86" width="210" height="30" rx="8" fill="#209D9E"/>
<text x="50" y="106" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">1. Finished</text>
<text x="50" y="140" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Course is set to</text>
<text x="50" y="158" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">"Finished"</text>
<text x="50" y="182" font-family="'Roboto', sans-serif" font-size="12" fill="#135E5F">access depends on configuration</text>
<text x="50" y="198" font-family="'Roboto', sans-serif" font-size="12" fill="#B2CF42">reversible</text>

<path d="M244 146 L280 146" stroke="#135E5F" stroke-width="2"/><path d="M276 142 l8 4 l-8 4 z" fill="#135E5F"/>
<text x="262" y="136" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="11" fill="#A6A6A6">period</text>

<rect x="286" y="86" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#F2AF40" stroke-width="2"/>
<rect x="286" y="86" width="210" height="30" rx="8" fill="#F2AF40"/>
<text x="306" y="106" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" fill="#2D2926">2. Trash</text>
<text x="306" y="140" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Course is moved,</text>
<text x="306" y="158" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">participants removed</text>
<text x="306" y="182" font-family="'Roboto', sans-serif" font-size="12" fill="#135E5F">visible in the authoring area</text>
<text x="306" y="198" font-family="'Roboto', sans-serif" font-size="12" fill="#B2CF42">can be restored</text>

<path d="M500 146 L536 146" stroke="#135E5F" stroke-width="2"/><path d="M532 142 l8 4 l-8 4 z" fill="#135E5F"/>
<text x="518" y="136" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="11" fill="#A6A6A6">period</text>

<rect x="542" y="86" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#8F1F40" stroke-width="2"/>
<rect x="542" y="86" width="210" height="30" rx="8" fill="#8F1F40"/>
<text x="562" y="106" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">3. Permanently deleted</text>
<text x="562" y="140" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Course including its data</text>
<text x="562" y="158" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">is deleted</text>
<text x="562" y="182" font-family="'Roboto', sans-serif" font-size="12" fill="#8F1F40">cannot be restored</text>

<rect x="30" y="232" width="722" height="70" rx="8" fill="#FFFFFF" stroke="#A6A6A6"/>
<text x="50" y="256" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" fill="#135E5F">Before saving: confirmation with preview</text>
<text x="50" y="278" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">OpenOlat shows how many courses the new configuration sets to which step. Cancelling saves nothing.</text>
<text x="50" y="294" font-family="'Roboto', sans-serif" font-size="12" fill="#A6A6A6">Afterwards the section "Life cycle process" shows the running process, the next run and the forecast for the coming days.</text>
</svg>
