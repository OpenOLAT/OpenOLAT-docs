<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="'Roboto', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#135E5F"/>
    </marker>
    <marker id="arrow-berry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8F1F40"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#F3F4EF"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#135E5F">Zugangsdaten per Einladungslink setzen</text>
  <text x="40" y="68" font-size="13" fill="#2D2926">Die Administrator:in sendet den Link, OpenOlat begrenzt seine Gültigkeit, die Person setzt ihre Zugangsdaten selbst.</text>

  <!-- Lanes -->
  <rect x="40" y="96" width="1020" height="150" rx="8" fill="#FFFFFF" stroke="#E0E1DA"/>
  <rect x="40" y="262" width="1020" height="150" rx="8" fill="#FFFFFF" stroke="#E0E1DA"/>
  <rect x="40" y="428" width="1020" height="150" rx="8" fill="#FFFFFF" stroke="#E0E1DA"/>
  <rect x="40" y="96" width="120" height="150" rx="8" fill="#135E5F"/>
  <rect x="40" y="262" width="120" height="150" rx="8" fill="#209D9E"/>
  <rect x="40" y="428" width="120" height="150" rx="8" fill="#135E5F"/>
  <text x="100" y="175" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Administrator:in</text>
  <text x="100" y="341" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">OpenOlat</text>
  <text x="100" y="507" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Person</text>

  <!-- Admin lane: step 1 -->
  <rect x="190" y="118" width="250" height="106" rx="6" fill="#F3F4EF" stroke="#209D9E" stroke-width="2"/>
  <text x="204" y="142" font-size="13" font-weight="700" fill="#135E5F">1  Tab «Passwort» öffnen</text>
  <text x="204" y="162" font-size="12" fill="#2D2926">Benutzerverwaltung › Benutzerdetail.</text>
  <text x="204" y="179" font-size="12" fill="#2D2926">Die Person hat noch keine lokale</text>
  <text x="204" y="196" font-size="12" fill="#2D2926">OpenOlat-Authentifizierung.</text>

  <!-- Admin lane: step 2 -->
  <rect x="470" y="118" width="250" height="106" rx="6" fill="#209D9E" stroke="#209D9E" stroke-width="2"/>
  <text x="484" y="142" font-size="13" font-weight="700" fill="#FFFFFF">2  Link senden</text>
  <text x="484" y="162" font-size="12" fill="#FFFFFF">Button «Einladungslink zum Setzen</text>
  <text x="484" y="179" font-size="12" fill="#FFFFFF">der Zugangsdaten senden».</text>
  <text x="484" y="204" font-size="11.5" fill="#FFFFFF" font-style="italic">Alternative: «Zugangsdaten erstellen» legt</text>
  <text x="484" y="219" font-size="11.5" fill="#FFFFFF" font-style="italic">Benutzername und Passwort direkt fest.</text>

  <!-- Admin lane: step 5 optional -->
  <rect x="750" y="118" width="290" height="106" rx="6" fill="#FFFFFF" stroke="#8F1F40" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="764" y="142" font-size="13" font-weight="700" fill="#8F1F40">Jederzeit: Link deaktivieren</text>
  <text x="764" y="162" font-size="12" fill="#2D2926">Der Tab «Passwort» meldet: Link versendet,</text>
  <text x="764" y="179" font-size="12" fill="#2D2926">gültig bis Datum und Uhrzeit.</text>
  <text x="764" y="199" font-size="12" fill="#2D2926">Aktion «Einladungslink deaktivieren»</text>
  <text x="764" y="216" font-size="12" fill="#2D2926">macht den Link sofort ungültig.</text>

  <path d="M440,171 L470,171" fill="none" stroke="#135E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- System lane: step 3 -->
  <rect x="470" y="284" width="250" height="106" rx="6" fill="#F3F4EF" stroke="#209D9E" stroke-width="2"/>
  <text x="484" y="308" font-size="13" font-weight="700" fill="#135E5F">3  E-Mail «Zugangsdaten setzen»</text>
  <text x="484" y="328" font-size="12" fill="#2D2926">Enthält den Einladungslink.</text>
  <text x="484" y="348" font-size="12" fill="#2D2926">Der Link gilt so lange, wie unter</text>
  <text x="484" y="365" font-size="12" fill="#2D2926">«Gültigkeitsdauer der Logindaten»</text>
  <text x="484" y="382" font-size="12" fill="#2D2926">eingestellt ist.</text>

  <!-- Setting box -->
  <rect x="190" y="284" width="250" height="106" rx="6" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
  <text x="204" y="308" font-size="13" font-weight="700" fill="#2D2926">Einstellung</text>
  <text x="204" y="328" font-size="12" fill="#2D2926">Administration › Login ›</text>
  <text x="204" y="345" font-size="12" fill="#2D2926">Selbstregistrierung › Abschnitt</text>
  <text x="204" y="362" font-size="12" fill="#2D2926">«Gültigkeitsdauer der Logindaten».</text>
  <text x="204" y="381" font-size="11.5" fill="#A6A6A6">Gilt für Selbstregistrierung und Einladungslink.</text>
  <path d="M440,337 L470,337" fill="none" stroke="#A6A6A6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- System lane: step 6 result -->
  <rect x="750" y="284" width="290" height="106" rx="6" fill="#FFFFFF" stroke="#B2CF42" stroke-width="2.5"/>
  <text x="764" y="308" font-size="13" font-weight="700" fill="#2D2926">6  Zugangsdaten gespeichert</text>
  <text x="764" y="328" font-size="12" fill="#2D2926">Die Person meldet sich mit Benutzername</text>
  <text x="764" y="345" font-size="12" fill="#2D2926">und Passwort an.</text>
  <text x="764" y="365" font-size="12" fill="#2D2926">Der Tab «Passwort» zeigt jetzt die lokale</text>
  <text x="764" y="382" font-size="12" fill="#2D2926">Authentifizierung statt des Links.</text>

  <!-- Person lane: step 4 -->
  <rect x="470" y="450" width="250" height="106" rx="6" fill="#F3F4EF" stroke="#209D9E" stroke-width="2"/>
  <text x="484" y="474" font-size="13" font-weight="700" fill="#135E5F">4  Link anklicken</text>
  <text x="484" y="494" font-size="12" fill="#2D2926">Vor dem Ablaufdatum.</text>
  <text x="484" y="519" font-size="12" fill="#8F1F40">Nach Ablauf oder Deaktivierung führt</text>
  <text x="484" y="536" font-size="12" fill="#8F1F40">der Link ins Leere. Ein neuer Link</text>
  <text x="484" y="553" font-size="12" fill="#8F1F40">kann gesendet werden.</text>

  <!-- Person lane: step 5 -->
  <rect x="750" y="450" width="290" height="106" rx="6" fill="#209D9E" stroke="#209D9E" stroke-width="2"/>
  <text x="764" y="474" font-size="13" font-weight="700" fill="#FFFFFF">5  Assistent «Zugangsdaten setzen»</text>
  <text x="764" y="494" font-size="12" fill="#FFFFFF">Die Person wählt Benutzername und</text>
  <text x="764" y="511" font-size="12" fill="#FFFFFF">Passwort selbst.</text>
  <text x="764" y="536" font-size="11.5" fill="#FFFFFF" font-style="italic">Bis 20.2: «Neues OpenOlat-Passwort setzen».</text>

  <!-- Flow arrows -->
  <path d="M595,224 L595,284" fill="none" stroke="#135E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M595,390 L595,450" fill="none" stroke="#135E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M720,503 L750,503" fill="none" stroke="#135E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M895,450 L895,390" fill="none" stroke="#135E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Deactivate arrow from admin box down to link (step 3 box) -->
  <path d="M750,200 C735,200 735,320 720,320" fill="none" stroke="#8F1F40" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-berry)"/>
  <!-- Info back to admin: link sent -->
  <path d="M720,300 C735,300 735,171 750,171" fill="none" stroke="#A6A6A6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="1058" y="606" font-size="11" fill="#A6A6A6" text-anchor="end">OpenOlat ∞</text>
</svg>
