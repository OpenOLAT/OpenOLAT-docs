<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1237 580" width="1237" height="580" role="img" aria-labelledby="t d">
  <title id="t">Sequence of the user data export in OpenOlat by role</title>
  <desc id="d">Three lanes: the user manager triggers the export in the account management, OpenOlat creates the file in the background and emails the link to the person who triggered it, the person concerned downloads the file under Settings, User data tab. Only the person concerned has access, and the file is deleted after one month.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#135E5F"/>
    </marker>
    <marker id="arrPeach" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F2AF40"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A6A6A6"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; fill: #2D2926; }
    .lane { fill: #FFFFFF; stroke: #A6A6A6; stroke-width: 1; }
    .laneTitle { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .laneSub { font-size: 12px; fill: #E6F4F4; }
    .step { font-size: 13px; font-weight: 700; fill: #135E5F; }
    .label { font-size: 13px; }
    .ui { font-size: 12.5px; font-weight: 700; }
    .flow { stroke: #135E5F; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .flowPeach { stroke: #F2AF40; stroke-width: 2; fill: none; marker-end: url(#arrPeach); stroke-dasharray: 6 4; }
    .flowGrey { stroke: #A6A6A6; stroke-width: 2; fill: none; marker-end: url(#arrGrey); stroke-dasharray: 3 4; }
    .badge { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .note { font-size: 12.5px; }
  </style>
  <rect x="0" y="0" width="1237" height="580" fill="#F3F4EF"/>
  <rect class="lane" x="20" y="20" width="1197" height="150"/>
  <rect x="20" y="20" width="190" height="150" fill="#209D9E"/>
  <text x="36" y="87" class="laneTitle">User manager</text>
  <text x="36" y="109" class="laneSub">Administrator, roles</text>
  <text x="36" y="125" class="laneSub">manager, principal</text>
  <rect class="lane" x="20" y="180" width="1197" height="150"/>
  <rect x="20" y="180" width="190" height="150" fill="#135E5F"/>
  <text x="36" y="255" class="laneTitle">OpenOlat</text>
  <text x="36" y="277" class="laneSub">Background task</text>
  <rect class="lane" x="20" y="340" width="1197" height="150"/>
  <rect x="20" y="340" width="190" height="150" fill="#209D9E"/>
  <text x="36" y="415" class="laneTitle">Person concerned</text>
  <text x="36" y="437" class="laneSub">Holder of the account</text>
  <rect x="244" y="45" width="202" height="100" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="260" y="70" class="step">1  Open the account</text>
  <text x="260" y="91" class="label">Account management, toolbar</text>
  <text x="260" y="112" class="ui">"Export data"</text>
  <rect x="480" y="45" width="314" height="100" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="496" y="70" class="step">2  Select elements</text>
  <text x="496" y="91" class="label">Dialog "Export user data of …"</text>
  <text x="496" y="112" class="ui">"Start export"</text>
  <rect x="828" y="45" width="355" height="100" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="844" y="70" class="step">4  Receive the email, forward the link</text>
  <text x="844" y="91" class="label">"The export for … is ready" with "Link to the data"</text>
  <text x="844" y="112" class="label">No access to the file itself</text>
  <rect x="480" y="205" width="314" height="100" rx="8" fill="#F3F4EF" stroke="#135E5F" stroke-width="2"/>
  <text x="496" y="230" class="step">3  Create the export</text>
  <text x="496" y="251" class="label">Can take several hours</text>
  <text x="496" y="272" class="label">One export per account, replaces the previous one</text>
  <text x="496" y="293" class="label">File Archive.zip, one folder per element</text>
  <rect x="828" y="205" width="355" height="100" rx="8" fill="#F3F4EF" stroke="#135E5F" stroke-width="2"/>
  <text x="844" y="230" class="step">7  Deleted after one month</text>
  <text x="844" y="251" class="label">A daily job removes exports that are</text>
  <text x="844" y="272" class="label">older than one month.</text>
  <text x="844" y="293" class="label">After that a new export is required.</text>
  <rect x="480" y="365" width="314" height="100" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="496" y="390" class="step">5  Open the link or use the menu</text>
  <text x="496" y="411" class="label">Personal menu &gt; Settings</text>
  <text x="496" y="432" class="ui">"User data" tab</text>
  <rect x="828" y="365" width="355" height="100" rx="8" fill="#FFFFFF" stroke="#F2AF40" stroke-width="2.5"/>
  <text x="844" y="390" class="step">6  Download the file</text>
  <text x="844" y="411" class="ui">"Download the data"</text>
  <text x="844" y="432" class="label">Only the person concerned sees the file</text>
  <rect x="1101" y="378" width="70" height="20" rx="10" fill="#F2AF40"/>
  <text x="1136" y="392" class="badge" text-anchor="middle">Location</text>
  <path class="flow" d="M446 95 H480"/>
  <path class="flow" d="M637 145 V205"/>
  <path class="flow" d="M794 255 H806 V95 H828"/>
  <path class="flowPeach" d="M1005 145 V175 H458 V415 H480"/>
  <path class="flow" d="M794 415 H828"/>
  <path class="flowGrey" d="M1005 305 V365"/>
  <line x1="36" y1="524" x2="76" y2="524" class="flowPeach"/>
  <text x="86" y="528" class="note">"Link to the data" is forwarded</text>
  <line x1="614" y1="524" x2="654" y2="524" class="flowGrey"/>
  <text x="664" y="528" class="note">Deadline: the file stays available for one month</text>
  <text x="1197" y="568" text-anchor="end" style="font-size:11px; fill:#A6A6A6">OpenOlat ∞ User data export</text>
</svg>
