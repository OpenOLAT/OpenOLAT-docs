<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 420" width="930" height="420" role="img" aria-label="Wer einen Korrekturauftrag einrichtet: fünf Schritte von der Systemadministration bis zur Abgabe, dazu die Zuweisung in der Auftragsverwaltung">
  <rect x="0" y="0" width="930" height="420" fill="#F3F4EF"/>
  <text x="30" y="42" font-family="'Roboto', sans-serif" font-size="21" font-weight="700" fill="#135E5F">Wer einen Korrekturauftrag einrichtet</text>
  <text x="30" y="66" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Drei Rollen richten ihn ein, die Abgabe löst ihn aus, die Korrektor:in bearbeitet ihn.</text>

  <g font-family="'Roboto', sans-serif">
    <rect x="30" y="96" width="194" height="124" rx="6" fill="#FFFFFF" stroke="#A6A6A6"/>
    <text x="44" y="120" font-size="12" font-weight="700" fill="#135E5F">1. Systemadministrator:in</text>
    <text x="44" y="141" font-size="12" fill="#2D2926">Administration:</text>
    <text x="44" y="158" font-size="12" fill="#2D2926">e-Assessment,</text>
    <text x="44" y="175" font-size="12" fill="#2D2926">Korrektur-Workflow</text>
    <text x="44" y="192" font-size="12" fill="#2D2926">einschalten.</text>

    <rect x="242" y="96" width="164" height="124" rx="6" fill="#FFFFFF" stroke="#A6A6A6"/>
    <text x="256" y="120" font-size="12" font-weight="700" fill="#135E5F">2. Besitzer:in Test</text>
    <text x="256" y="141" font-size="12" fill="#2D2926">Lernressource Test,</text>
    <text x="256" y="158" font-size="12" fill="#2D2926">Administration &gt;</text>
    <text x="256" y="175" font-size="12" fill="#2D2926">Korrektur-Workflow,</text>
    <text x="256" y="192" font-size="12" fill="#2D2926">Tab «Konfiguration»:</text>
    <text x="256" y="209" font-size="12" fill="#2D2926">Workflow einschalten.</text>

    <rect x="424" y="96" width="164" height="124" rx="6" fill="#FFFFFF" stroke="#A6A6A6"/>
    <text x="438" y="120" font-size="12" font-weight="700" fill="#135E5F">3. Besitzer:in Test</text>
    <text x="438" y="141" font-size="12" fill="#2D2926">Tab «Korrektor:innen»:</text>
    <text x="438" y="158" font-size="12" fill="#2D2926">Korrektor:innen</text>
    <text x="438" y="175" font-size="12" fill="#2D2926">eintragen, unab-</text>
    <text x="438" y="192" font-size="12" fill="#2D2926">hängig von der Rolle.</text>

    <rect x="606" y="96" width="164" height="124" rx="6" fill="#FFFFFF" stroke="#F2AF40" stroke-width="2"/>
    <text x="620" y="120" font-size="12" font-weight="700" fill="#135E5F">4. Kursbesitzer:in</text>
    <text x="620" y="141" font-size="12" fill="#2D2926">Kursbaustein Test,</text>
    <text x="620" y="158" font-size="12" fill="#2D2926">Abschnitt Korrektur:</text>
    <text x="620" y="175" font-size="12" fill="#2D2926">«Manuell durch</text>
    <text x="620" y="192" font-size="12" fill="#2D2926">Korrektor:innen»</text>
    <text x="620" y="209" font-size="12" fill="#2D2926">wählen.</text>

    <rect x="788" y="96" width="112" height="124" rx="6" fill="#209D9E"/>
    <text x="802" y="120" font-size="12" font-weight="700" fill="#FFFFFF">5. Abgabe</text>
    <text x="802" y="141" font-size="12" fill="#FFFFFF">Teilnehmer:in</text>
    <text x="802" y="158" font-size="12" fill="#FFFFFF">schliesst den</text>
    <text x="802" y="175" font-size="12" fill="#FFFFFF">Test ab und löst</text>
    <text x="802" y="192" font-size="12" fill="#FFFFFF">den Auftrag aus.</text>

    <path d="M224 150 L240 150" stroke="#209D9E" stroke-width="2" marker-end="url(#c)"/>
    <path d="M406 150 L422 150" stroke="#209D9E" stroke-width="2" marker-end="url(#c)"/>
    <path d="M588 150 L604 150" stroke="#209D9E" stroke-width="2" marker-end="url(#c)"/>
    <path d="M770 150 L786 150" stroke="#209D9E" stroke-width="2" marker-end="url(#c)"/>

    <path d="M844 220 L844 248" stroke="#135E5F" stroke-width="2" marker-end="url(#d)"/>
    <rect x="530" y="256" width="370" height="86" rx="6" fill="#135E5F"/>
    <text x="546" y="286" font-size="14" font-weight="700" fill="#FFFFFF">Korrekturauftrag im Coaching</text>
    <text x="546" y="308" font-size="12" fill="#FFFFFF">Coaching &gt; Bewertungsaufträge &gt; Korrekturaufträge,</text>
    <text x="546" y="326" font-size="12" fill="#FFFFFF">bei der zugewiesenen Korrektor:in.</text>

    <rect x="30" y="256" width="440" height="96" rx="6" fill="#FFFFFF" stroke="#F2AF40" stroke-width="2"/>
    <text x="44" y="280" font-size="12" font-weight="700" fill="#135E5F">Ist noch niemand zugewiesen?</text>
    <text x="44" y="302" font-size="12" fill="#2D2926">Der Auftrag wartet als «Nicht zugeordnet» in der Auftragsverwaltung.</text>
    <text x="44" y="320" font-size="12" fill="#2D2926">Dort weisen ihn Besitzer:innen des Tests, Lernressourcen-</text>
    <text x="44" y="338" font-size="12" fill="#2D2926">verwalter:innen oder Administrator:innen einer Korrektor:in zu.</text>
  </g>

  <text x="30" y="378" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Die Option in Schritt 4 steht zur Auswahl, sobald Schritt 2 gesetzt ist.</text>
  <text x="30" y="398" font-family="'Roboto', sans-serif" font-size="11" fill="#A6A6A6">Wer den Korrektur-Workflow selbst verwaltet, arbeitet unter Coaching &gt; Auftragsverwaltung statt unter Bewertungsaufträge.</text>

  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#209D9E"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#135E5F"/></marker>
  </defs>
</svg>
