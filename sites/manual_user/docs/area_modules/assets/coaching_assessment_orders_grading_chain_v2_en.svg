<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 420" width="930" height="420" role="img" aria-label="Who sets up a grading assignment: five steps from the system administration to the submission, plus the assignment in the order management">
  <rect x="0" y="0" width="930" height="420" fill="#F3F4EF"/>
  <text x="30" y="42" font-family="'Roboto', sans-serif" font-size="21" font-weight="700" fill="#135E5F">Who sets up a grading assignment</text>
  <text x="30" y="66" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Three roles set it up, the submission triggers it, the corrector works on it.</text>

  <g font-family="'Roboto', sans-serif">
    <rect x="30" y="96" width="194" height="124" rx="6" fill="#FFFFFF" stroke="#A6A6A6"/>
    <text x="44" y="120" font-size="12" font-weight="700" fill="#135E5F">1. System administrator</text>
    <text x="44" y="141" font-size="12" fill="#2D2926">Administration:</text>
    <text x="44" y="158" font-size="12" fill="#2D2926">e-Assessment,</text>
    <text x="44" y="175" font-size="12" fill="#2D2926">switch on the</text>
    <text x="44" y="192" font-size="12" fill="#2D2926">correction workflow.</text>

    <rect x="242" y="96" width="164" height="124" rx="6" fill="#FFFFFF" stroke="#A6A6A6"/>
    <text x="256" y="120" font-size="12" font-weight="700" fill="#135E5F">2. Test owner</text>
    <text x="256" y="141" font-size="12" fill="#2D2926">Learning resource Test,</text>
    <text x="256" y="158" font-size="12" fill="#2D2926">Administration &gt;</text>
    <text x="256" y="175" font-size="12" fill="#2D2926">Correction workflow,</text>
    <text x="256" y="192" font-size="12" fill="#2D2926">tab «Configuration»:</text>
    <text x="256" y="209" font-size="12" fill="#2D2926">switch on workflow.</text>

    <rect x="424" y="96" width="164" height="124" rx="6" fill="#FFFFFF" stroke="#A6A6A6"/>
    <text x="438" y="120" font-size="12" font-weight="700" fill="#135E5F">3. Test owner</text>
    <text x="438" y="141" font-size="12" fill="#2D2926">Tab «Correctors»:</text>
    <text x="438" y="158" font-size="12" fill="#2D2926">enter the people,</text>
    <text x="438" y="175" font-size="12" fill="#2D2926">regardless of</text>
    <text x="438" y="192" font-size="12" fill="#2D2926">their role.</text>

    <rect x="606" y="96" width="164" height="124" rx="6" fill="#FFFFFF" stroke="#F2AF40" stroke-width="2"/>
    <text x="620" y="120" font-size="12" font-weight="700" fill="#135E5F">4. Course owner</text>
    <text x="620" y="141" font-size="12" fill="#2D2926">Course element Test,</text>
    <text x="620" y="158" font-size="12" fill="#2D2926">section Correction:</text>
    <text x="620" y="175" font-size="12" fill="#2D2926">choose «Manual by</text>
    <text x="620" y="192" font-size="12" fill="#2D2926">graders».</text>

    <rect x="788" y="96" width="112" height="124" rx="6" fill="#209D9E"/>
    <text x="802" y="120" font-size="12" font-weight="700" fill="#FFFFFF">5. Submission</text>
    <text x="802" y="141" font-size="12" fill="#FFFFFF">Participant</text>
    <text x="802" y="158" font-size="12" fill="#FFFFFF">completes the</text>
    <text x="802" y="175" font-size="12" fill="#FFFFFF">test and</text>
    <text x="802" y="192" font-size="12" fill="#FFFFFF">triggers the</text>
    <text x="802" y="209" font-size="12" fill="#FFFFFF">assignment.</text>

    <path d="M224 150 L240 150" stroke="#209D9E" stroke-width="2" marker-end="url(#c)"/>
    <path d="M406 150 L422 150" stroke="#209D9E" stroke-width="2" marker-end="url(#c)"/>
    <path d="M588 150 L604 150" stroke="#209D9E" stroke-width="2" marker-end="url(#c)"/>
    <path d="M770 150 L786 150" stroke="#209D9E" stroke-width="2" marker-end="url(#c)"/>

    <path d="M844 220 L844 248" stroke="#135E5F" stroke-width="2" marker-end="url(#d)"/>
    <rect x="530" y="256" width="370" height="86" rx="6" fill="#135E5F"/>
    <text x="546" y="286" font-size="14" font-weight="700" fill="#FFFFFF">Grading assignment in the coaching</text>
    <text x="546" y="308" font-size="12" fill="#FFFFFF">Coaching &gt; Assessment orders &gt; Grading assignments,</text>
    <text x="546" y="326" font-size="12" fill="#FFFFFF">at the assigned corrector.</text>

    <rect x="30" y="256" width="440" height="96" rx="6" fill="#FFFFFF" stroke="#F2AF40" stroke-width="2"/>
    <text x="44" y="280" font-size="12" font-weight="700" fill="#135E5F">Nobody assigned yet?</text>
    <text x="44" y="302" font-size="12" fill="#2D2926">The assignment waits as «Unassigned» in the order management.</text>
    <text x="44" y="320" font-size="12" fill="#2D2926">There, owners of the test, learning resource managers or</text>
    <text x="44" y="338" font-size="12" fill="#2D2926">administrators assign it to a corrector.</text>
  </g>

  <text x="30" y="378" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">The option in step 4 becomes available as soon as step 2 is set.</text>
  <text x="30" y="398" font-family="'Roboto', sans-serif" font-size="11" fill="#A6A6A6">Anyone who manages the correction workflow works under Coaching &gt; Order management instead of Assessment orders.</text>

  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#209D9E"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#135E5F"/></marker>
  </defs>
</svg>
