<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 804" width="940" height="804" role="img" aria-label="The administration sets up the sending of notifications. Users receive the e-mail if they chose an interval, and no e-mail if they chose Never, even when the administration has set up the sending.">
  <title>Who decides whether a notification arrives?</title>
<rect x="0" y="0" width="940" height="804" fill="#F3F4EF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#126365"/></marker></defs>
<text x="40" y="52" font-family="'Roboto', sans-serif" font-size="26" font-weight="700" fill="#126365" text-anchor="start">Who decides whether a notification arrives?</text>
<text x="40" y="82" font-family="'Roboto', sans-serif" font-size="17" fill="#2D2926" text-anchor="start">The administration defines when OpenOlat sends. Users decide whether they receive the e-mail.</text>
<rect x="250" y="112" width="440" height="118" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="2.5"/>
<text x="470" y="150" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#126365" text-anchor="middle">Administration</text>
<text x="470" y="184" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">sets up the sending for the whole instance,</text>
<text x="470" y="208" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">by default every two hours</text>
<path d="M 470 232 L 470 266" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250" y="270" width="440" height="118" rx="10" fill="#FFFFFF" stroke="#5F6E23" stroke-width="2.5"/>
<text x="470" y="308" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#5F6E23" text-anchor="middle">Users</text>
<text x="470" y="342" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">choose in their settings under</text>
<text x="470" y="366" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">«E-mail notification»</text>
<path d="M 470 390 L 470 414" fill="none" stroke="#126365" stroke-width="2.5"/>
<path d="M 470 414 L 245 454" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 470 414 L 695 454" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="458" width="410" height="118" rx="10" fill="#E3EFEF" stroke="#126365" stroke-width="2.5"/>
<text x="245" y="496" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#126365" text-anchor="middle">Interval chosen, e.g. «Daily»</text>
<text x="245" y="530" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">They receive an e-mail with the news,</text>
<text x="245" y="554" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">at most as often as chosen.</text>
<rect x="490" y="458" width="410" height="118" rx="10" fill="#EEF2DF" stroke="#5F6E23" stroke-width="4"/>
<text x="695" y="496" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#5F6E23" text-anchor="middle">«Never» chosen</text>
<text x="695" y="530" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">They receive no e-mail, even though the</text>
<text x="695" y="554" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">administration has set up the sending.</text>
<path d="M 695 578 L 695 612" fill="none" stroke="#126365" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="490" y="616" width="410" height="152" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="2.5"/>
<text x="695" y="654" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#126365" text-anchor="middle">The news stays visible</text>
<text x="695" y="688" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">In the personal menu under</text>
<rect x="584" y="695" width="223" height="24" rx="3" fill="#EDEDED"/>
<text x="695" y="712" font-family="'Roboto Mono', 'Courier New', monospace" font-size="14" fill="#36464E" text-anchor="middle">Subscriptions &gt; Tab "News"</text>
<text x="695" y="746" font-family="'Roboto', sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">and via the bell icon in the course element</text>
</svg>
