<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="Eine Punkteanpassung an einer Frage erscheint im Korrekturwerkzeug, in der Liste der Testversuche, in den Test Statistiken und im Export der Testresultate">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#135E5F"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="480" fill="#F3F4EF"/>

  <text x="30" y="40" font-family="'Roboto', sans-serif" font-size="20" font-weight="600" fill="#2D2926">Wo eine Punkteanpassung sichtbar wird</text>
  <text x="30" y="64" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Ein Eingriff an einer Frage, vier Orte, an denen er nachvollziehbar bleibt.</text>

  <rect x="30" y="180" width="230" height="110" rx="10" fill="#209D9E"/>
  <text x="145" y="215" font-family="'Roboto', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Antwort einer Person</text>
  <text x="145" y="240" font-family="'Roboto', sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">Button "Punkte anpassen"</text>
  <text x="145" y="266" font-family="'Roboto', sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">Status wird "Angepasst"</text>

  <rect x="460" y="95" width="390" height="62" rx="8" fill="#FFFFFF" stroke="#135E5F" stroke-width="1.5"/>
  <text x="478" y="120" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" fill="#135E5F">Korrekturwerkzeug</text>
  <text x="478" y="141" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Spalte "#Angepasst", Registerkarte "Angepasst"</text>

  <rect x="460" y="175" width="390" height="62" rx="8" fill="#FFFFFF" stroke="#135E5F" stroke-width="1.5"/>
  <text x="478" y="200" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" fill="#135E5F">Testversuche einer Person</text>
  <text x="478" y="221" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">"Punkte (Auto)" zeigt die Anpassung in Klammern</text>

  <rect x="460" y="255" width="390" height="62" rx="8" fill="#FFFFFF" stroke="#135E5F" stroke-width="1.5"/>
  <text x="478" y="280" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" fill="#135E5F">Test Statistiken</text>
  <text x="478" y="301" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">"Anzahl der Anpassungen", "Durchschnittliche Anpassung"</text>

  <rect x="460" y="335" width="390" height="62" rx="8" fill="#FFFFFF" stroke="#135E5F" stroke-width="1.5"/>
  <text x="478" y="360" font-family="'Roboto', sans-serif" font-size="14" font-weight="600" fill="#135E5F">Export der Testresultate</text>
  <text x="478" y="377" font-family="'Roboto', sans-serif" font-size="11" fill="#2D2926">"Punkte (Anpassungen plus)", "Punkte (Anpassungen minus)"</text>
  <text x="478" y="391" font-family="'Roboto', sans-serif" font-size="11" fill="#2D2926">je Frage "Anpassung"</text>

  <path d="M 260 220 C 350 220 360 126 455 126" fill="none" stroke="#135E5F" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 260 228 C 350 228 360 206 455 206" fill="none" stroke="#135E5F" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 260 244 C 350 244 360 286 455 286" fill="none" stroke="#135E5F" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 260 252 C 350 252 360 366 455 366" fill="none" stroke="#135E5F" stroke-width="2" marker-end="url(#a2)"/>

  <text x="30" y="440" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">"Punkte" bleibt in allen Ansichten das Ergebnis. "Punkte (Auto)" und "Punkte (Manuell)" zeigen, woher es stammt.</text>
</svg>
