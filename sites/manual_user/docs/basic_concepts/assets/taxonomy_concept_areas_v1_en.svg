<svg width="940" height="560" viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="'Roboto', Arial, sans-serif">
  <title>Where a taxonomy takes effect</title>
  <defs>
    <marker id="arSea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#126365"/></marker>
    <marker id="arSpr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6E23"/></marker>
  </defs>
  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#342C24">Where a taxonomy takes effect</text>
  <!-- Taxonomie mit Aufbau -->
  <rect x="190" y="50" width="560" height="102" rx="8" fill="#E6F0F0" stroke="#126365" stroke-width="1.5"/>
  <rect x="190" y="50" width="560" height="34" rx="8" fill="#126365"/>
  <rect x="190" y="70" width="560" height="14" fill="#126365"/>
  <text x="470" y="73" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Taxonomy</text>
  <rect x="228" y="96" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <text x="273" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Taxonomy</text>
  <text x="333" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#126365">›</text>
  <rect x="348" y="96" width="125" height="30" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <text x="411" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Taxonomy level</text>
  <text x="489" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#126365">›</text>
  <rect x="504" y="96" width="87" height="30" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <text x="547" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Level type</text>
  <text x="606" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#126365">›</text>
  <rect x="621" y="96" width="91" height="30" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <text x="666" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Competence</text>
  <text x="470" y="140" text-anchor="middle" font-size="12" fill="#2D2926">several taxonomies side by side possible</text>
  <line x1="470" y1="152" x2="470" y2="190" stroke="#126365" stroke-width="1.5" marker-end="url(#arSea)"/>
  <text x="482" y="176" text-anchor="start" font-size="12" fill="#2D2926">takes effect only once administrators select it in the area</text>
  <!-- Bereiche in der Übersicht des Moduls Taxonomie -->
  <rect x="20" y="192" width="900" height="142" rx="8" fill="#E6F0F0" stroke="#126365" stroke-width="1.5"/>
  <text x="36" y="214" text-anchor="start" font-size="13" font-weight="bold" fill="#126365">In the overview of the module Taxonomy, with its own setting per area</text>
  <rect x="36" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="110" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Media Center</text>
  <text x="110" y="279" text-anchor="middle" font-size="12" fill="#2D2926">Subjects</text>
  <text x="110" y="295" text-anchor="middle" font-size="12" fill="#2D2926">of media</text>
  <rect x="248" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="322" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Learning resources</text>
  <text x="322" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">/ Catalog</text>
  <text x="322" y="287" text-anchor="middle" font-size="12" fill="#2D2926">Subjects,</text>
  <text x="322" y="303" text-anchor="middle" font-size="12" fill="#2D2926">launchers and filters</text>
  <rect x="416" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="490" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Course Planner</text>
  <text x="490" y="279" text-anchor="middle" font-size="12" fill="#2D2926">Subjects of</text>
  <text x="490" y="295" text-anchor="middle" font-size="12" fill="#2D2926">implementations</text>
  <rect x="584" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="658" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">ePortfolio</text>
  <text x="658" y="279" text-anchor="middle" font-size="12" fill="#2D2926">Competences in</text>
  <text x="658" y="295" text-anchor="middle" font-size="12" fill="#2D2926">portfolio entries</text>
  <rect x="752" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="826" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Question bank</text>
  <text x="826" y="279" text-anchor="middle" font-size="12" fill="#2D2926">own taxonomy,</text>
  <text x="826" y="295" text-anchor="middle" font-size="12" fill="#2D2926">not replaceable</text>
  <line x1="186" y1="280" x2="246" y2="280" stroke="#126365" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arSea)"/>
  <text x="216" y="258" text-anchor="middle" font-size="11" fill="#2D2926">without</text>
  <text x="216" y="271" text-anchor="middle" font-size="11" fill="#2D2926">selection</text>
  <!-- Bereiche ohne eigene Auswahl -->
  <rect x="20" y="420" width="900" height="120" rx="8" fill="#F4F7EA" stroke="#5F6E23" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="454" text-anchor="start" font-size="13" font-weight="bold" fill="#5F6E23">Without own setting</text>
  <text x="36" y="474" text-anchor="start" font-size="12" fill="#2D2926">take over the</text>
  <text x="36" y="490" text-anchor="start" font-size="12" fill="#2D2926">taxonomies of an</text>
  <text x="36" y="506" text-anchor="start" font-size="12" fill="#2D2926">area above</text>
  <rect x="222" y="440" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#5F6E23" stroke-width="1.2"/>
  <text x="302" y="467" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Events</text>
  <text x="302" y="487" text-anchor="middle" font-size="12" fill="#2D2926">depending on course</text>
  <text x="302" y="503" text-anchor="middle" font-size="12" fill="#2D2926">or implementation</text>
  <rect x="422" y="440" width="176" height="80" rx="6" fill="#FFFFFF" stroke="#5F6E23" stroke-width="1.2"/>
  <text x="510" y="467" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Quality management</text>
  <text x="510" y="487" text-anchor="middle" font-size="12" fill="#2D2926">Subjects of the course</text>
  <text x="510" y="503" text-anchor="middle" font-size="12" fill="#2D2926">or of the element</text>
  <rect x="746" y="440" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#5F6E23" stroke-width="1.2"/>
  <text x="826" y="461" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Course element</text>
  <text x="826" y="477" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">«Practice»</text>
  <text x="826" y="495" text-anchor="middle" font-size="12" fill="#2D2926">Subjects from</text>
  <text x="826" y="510" text-anchor="middle" font-size="12" fill="#2D2926">the question bank</text>
  <g stroke="#5F6E23" stroke-width="1.5" fill="none">
    <line x1="322" y1="316" x2="322" y2="384"/>
    <line x1="490" y1="316" x2="490" y2="384"/>
    <line x1="302" y1="384" x2="510" y2="384"/>
    <line x1="302" y1="384" x2="302" y2="438" marker-end="url(#arSpr)"/>
    <line x1="510" y1="384" x2="510" y2="438" marker-end="url(#arSpr)"/>
    <line x1="826" y1="316" x2="826" y2="438" marker-end="url(#arSpr)"/>
  </g>
  <circle cx="322" cy="384" r="3" fill="#5F6E23"/>
  <circle cx="490" cy="384" r="3" fill="#5F6E23"/>
</svg>
