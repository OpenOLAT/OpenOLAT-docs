<svg width="940" height="420" viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="'Roboto', Arial, sans-serif">
  <title>A taxonomy level takes effect on objects as a subject and on people as a competence</title>
  <defs>
    <marker id="arSea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#126365"/></marker>
    <marker id="arSpr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6E23"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="420" fill="#FFFFFF"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#342C24">One taxonomy level, two effects</text>

  <!-- Mitte: Taxonomie -->
  <rect x="340" y="56" width="260" height="270" rx="8" fill="#FFFFFF" stroke="#342C24" stroke-width="1.5"/>
  <rect x="340" y="56" width="260" height="36" rx="8" fill="#342C24"/>
  <rect x="340" y="78" width="260" height="14" fill="#342C24"/>
  <text x="470" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Taxonomy «Disciplines»</text>
  <g font-size="14" fill="#2D2926">
    <text x="372" y="124">Languages</text>
    <line x1="378" y1="130" x2="378" y2="186" stroke="#8A8580" stroke-width="1"/>
    <line x1="378" y1="150" x2="396" y2="150" stroke="#8A8580" stroke-width="1"/>
    <text x="402" y="155">German</text>
    <line x1="378" y1="186" x2="396" y2="186" stroke="#8A8580" stroke-width="1"/>
    <rect x="398" y="171" width="92" height="28" rx="6" fill="#FFF4E0" stroke="#916926" stroke-width="1.5"/>
    <text x="408" y="190" font-weight="bold">English</text>
    <text x="372" y="236">STEM</text>
    <line x1="378" y1="242" x2="378" y2="292" stroke="#8A8580" stroke-width="1"/>
    <line x1="378" y1="262" x2="396" y2="262" stroke="#8A8580" stroke-width="1"/>
    <text x="402" y="267">Mathematics</text>
    <line x1="378" y1="292" x2="396" y2="292" stroke="#8A8580" stroke-width="1"/>
    <text x="402" y="297">Biology</text>
  </g>
  <text x="470" y="316" text-anchor="middle" font-size="12" fill="#2D2926">Taxonomy level «English»</text>

  <!-- Pfeile -->
  <line x1="398" y1="185" x2="302" y2="185" stroke="#126365" stroke-width="1.8" marker-end="url(#arSea)"/>
  <line x1="490" y1="185" x2="638" y2="185" stroke="#5F6E23" stroke-width="1.8" marker-end="url(#arSpr)"/>

  <!-- Links: an Objekten -->
  <rect x="20" y="56" width="280" height="270" rx="8" fill="#E6F0F0" stroke="#126365" stroke-width="1.5"/>
  <rect x="20" y="56" width="280" height="36" rx="8" fill="#126365"/>
  <rect x="20" y="78" width="280" height="14" fill="#126365"/>
  <text x="160" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">On objects</text>
  <text x="160" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D2926">it is called subject</text>
  <g font-size="13" fill="#2D2926" text-anchor="middle">
    <rect x="38" y="132" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#126365"/>
    <text x="96" y="151">Course</text>
    <rect x="166" y="132" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#126365"/>
    <text x="224" y="151">Implementation</text>
    <rect x="38" y="168" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#126365"/>
    <text x="96" y="187">Question</text>
    <rect x="166" y="168" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#126365"/>
    <text x="224" y="187">Media item</text>
  </g>
  <text x="38" y="228" font-size="13" font-weight="bold" fill="#126365">takes effect as</text>
  <g font-size="13" fill="#2D2926">
    <text x="38" y="252">• Tile and microsite in the catalog</text>
    <text x="38" y="276">• Filter in lists</text>
    <text x="38" y="300">• Filter in the analysis</text>
  </g>

  <!-- Rechts: an Personen -->
  <rect x="640" y="56" width="280" height="270" rx="8" fill="#F1F5E3" stroke="#5F6E23" stroke-width="1.5"/>
  <rect x="640" y="56" width="280" height="36" rx="8" fill="#5F6E23"/>
  <rect x="640" y="78" width="280" height="14" fill="#5F6E23"/>
  <text x="780" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">On people</text>
  <text x="780" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D2926">it is called competence</text>
  <g font-size="13" fill="#2D2926" text-anchor="middle">
    <rect x="658" y="132" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#5F6E23"/>
    <text x="716" y="151">Target</text>
    <rect x="786" y="132" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#5F6E23"/>
    <text x="844" y="151">Have</text>
    <rect x="658" y="168" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#5F6E23"/>
    <text x="716" y="187">Teach</text>
    <rect x="786" y="168" width="116" height="28" rx="6" fill="#FFFFFF" stroke="#5F6E23"/>
    <text x="844" y="187">Manage</text>
  </g>
  <text x="658" y="228" font-size="13" font-weight="bold" fill="#5F6E23">takes effect as</text>
  <g font-size="13" fill="#2D2926">
    <text x="658" y="252">• Display under «Competences»</text>
    <text x="658" y="276">• Selection in the ePortfolio</text>
    <text x="658" y="300">• Access in the question bank</text>
  </g>

  <!-- Voraussetzung -->
  <rect x="20" y="350" width="900" height="44" rx="8" fill="#EDEDED"/>
  <text x="470" y="377" text-anchor="middle" font-size="14" fill="#36464E">Administrators define for each area whether a taxonomy takes effect there.</text>
</svg>
