<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-labelledby="t1 d1">
  <title id="t1">Rahmen von der Inhaltsdomäne</title>
  <desc id="d1">Browserfenster mit der OpenOlat-Adresse learn.example.com und dem Sitzungs-Cookie von OpenOlat. Darin ein eingebetteter Rahmen von der Inhaltsdomäne content.example.net mit eigenem Cookie ohne OpenOlat-Sitzung. Das Skript im Rahmen erreicht das Sitzungs-Cookie nicht, die Same-Origin-Policy des Browsers sperrt den Zugriff. Nur eine geprüfte Nachricht, zum Beispiel ein Link auf einen Kursbaustein, gelangt zu OpenOlat.</desc>
  <defs>
    <marker id="arrSea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F5456"/>
    </marker>
    <marker id="arrBerry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8F1F40"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="480" fill="#FFFFFF"/>

  <!-- Browserfenster -->
  <rect x="20" y="20" width="900" height="440" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="2"/>
  <path d="M20,64 L20,30 A10,10 0 0 1 30,20 L910,20 A10,10 0 0 1 920,30 L920,64 Z" fill="rgba(18, 99, 101, 0.12)"/>
  <line x1="20" y1="64" x2="920" y2="64" stroke="#126365" stroke-width="1.5"/>
  <text x="40" y="48" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#342C24">Browser</text>
  <rect x="130" y="30" width="420" height="26" rx="13" fill="#FFFFFF" stroke="#126365" stroke-width="1.5"/>
  <text x="148" y="48" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">Adresszeile: https://learn.example.com</text>

  <!-- OpenOlat-Seite -->
  <text x="44" y="98" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#342C24">OpenOlat-Seite</text>
  <text x="44" y="118" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">learn.example.com</text>

  <rect x="44" y="136" width="220" height="78" rx="8" fill="#126365"/>
  <text x="154" y="168" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Sitzungs-Cookie</text>
  <text x="154" y="192" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#FFFFFF">OpenOlat-Sitzung der Person</text>

  <rect x="44" y="310" width="220" height="92" rx="8" fill="#FFFFFF" stroke="#126365" stroke-width="2"/>
  <text x="154" y="340" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#126365">OpenOlat prüft</text>
  <text x="154" y="362" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">die Nachricht und öffnet</text>
  <text x="154" y="382" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">z. B. den Kursbaustein</text>

  <!-- Eingebetteter Rahmen (iframe) -->
  <rect x="440" y="90" width="456" height="346" rx="8" fill="rgba(18, 99, 101, 0.12)" stroke="#126365" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="462" y="120" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#342C24">Eingebetteter Inhalt (iframe)</text>
  <text x="462" y="142" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">Inhaltsdomäne: content.example.net</text>

  <rect x="462" y="166" width="196" height="72" rx="8" fill="#FFFFFF" stroke="#2D2926" stroke-width="1.5"/>
  <text x="560" y="196" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926">Skript im Inhalt</text>
  <text x="560" y="218" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">HTML, CP, SCORM</text>

  <rect x="678" y="166" width="196" height="72" rx="8" fill="#FFFFFF" stroke="#11624F" stroke-width="1.5"/>
  <text x="776" y="196" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#11624F">Eigenes Cookie</text>
  <text x="776" y="218" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">keine OpenOlat-Sitzung</text>

  <text x="462" y="402" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">Beispiel für eine Nachricht:</text>
  <text x="462" y="422" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">Link auf einen anderen Kursbaustein</text>

  <!-- Gesperrter Zugriff -->
  <line x1="462" y1="190" x2="270" y2="175" stroke="#8F1F40" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrBerry)"/>
  <circle cx="352" cy="182" r="15" fill="#FFFFFF" stroke="#8F1F40" stroke-width="2.5"/>
  <line x1="344" y1="174" x2="360" y2="190" stroke="#8F1F40" stroke-width="2.5"/>
  <line x1="360" y1="174" x2="344" y2="190" stroke="#8F1F40" stroke-width="2.5"/>
  <text x="352" y="224" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#8F1F40">Kein Zugriff</text>
  <text x="352" y="244" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#8F1F40">Same-Origin-Policy</text>

  <!-- Geprüfte Nachricht -->
  <polyline points="560,238 560,356 270,356" fill="none" stroke="#0F5456" stroke-width="2.5" marker-end="url(#arrSea)"/>
  <text x="352" y="342" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#0F5456">Nachricht</text>
  <text x="352" y="378" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#0F5456">(postMessage)</text>
</svg>
