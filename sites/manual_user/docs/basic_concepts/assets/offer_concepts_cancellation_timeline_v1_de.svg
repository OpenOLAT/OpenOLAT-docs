<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Zeitraum, in dem Teilnehmende ihre Buchung einer Durchführung selbst stornieren können, je Angebotsart und Einstellung">
  <rect x="0" y="0" width="960" height="500" fill="#FFFFFF"/>

  <!-- Titel -->
  <text x="30" y="40" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#342C24">Wann Teilnehmende ihre Buchung selbst stornieren können</text>
  <text x="30" y="64" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Angebote einer Durchführung im Course Planner. Balken = die Schaltfläche "Buchung stornieren" ist auf der Infoseite sichtbar.</text>

  <!-- Zeitachse -->
  <line x1="310" y1="105" x2="925" y2="105" stroke="#0F5456" stroke-width="2"/>
  <polygon points="925,99 937,105 925,111" fill="#0F5456"/>
  <line x1="340" y1="97" x2="340" y2="410" stroke="#126365" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="640" y1="97" x2="640" y2="410" stroke="#8F1F40" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="340" y="90" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#2D2926">Buchung</text>
  <text x="640" y="90" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#8F1F40">Beginndatum</text>
  <text x="800" y="90" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Durchführung läuft</text>

  <!-- Zeile 1: Jederzeit -->
  <text x="30" y="145" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" fill="#126365">Frei verfügbar / Zugangscode</text>
  <text x="30" y="164" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Stornierbar ein, "Jederzeit" (Vorauswahl)</text>
  <rect x="340" y="135" width="580" height="30" rx="8" fill="#B2CF42"/>
  <text x="630" y="155" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">auch nach dem Beginn</text>

  <!-- Zeile 2: Bis zum Beginndatum -->
  <text x="30" y="205" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" fill="#126365">Frei verfügbar / Zugangscode</text>
  <text x="30" y="224" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Stornierbar ein, "Bis zum Beginndatum"</text>
  <rect x="340" y="195" width="296" height="30" rx="8" fill="#126365"/>
  <text x="488" y="215" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#FFFFFF">bis zum Tag vor dem Beginn</text>
  <rect x="644" y="195" width="276" height="30" rx="8" fill="#FFFFFF" stroke="#8F1F40" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="782" y="215" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#8F1F40">ab Beginn keine Schaltfläche</text>

  <!-- Zeile 3: Rechnung -->
  <text x="30" y="265" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" fill="#126365">Rechnung</text>
  <text x="30" y="284" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Stornierbar ein (Vorgabe)</text>
  <rect x="340" y="255" width="170" height="30" rx="8" fill="#126365"/>
  <text x="425" y="275" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#FFFFFF">kostenlos</text>
  <rect x="514" y="255" width="122" height="30" rx="8" fill="#F2AF40"/>
  <text x="575" y="275" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">mit Gebühr *</text>
  <rect x="644" y="255" width="276" height="30" rx="8" fill="#FFFFFF" stroke="#8F1F40" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="782" y="275" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#8F1F40">ab Beginn keine Schaltfläche</text>

  <!-- Zeile 4: Stornierbar aus -->
  <text x="30" y="325" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" fill="#126365">Frei verfügbar / Zugangscode / Rechnung</text>
  <text x="30" y="344" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Stornierbar aus</text>
  <rect x="340" y="315" width="580" height="30" rx="8" fill="#FFFFFF" stroke="#8F1F40" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="630" y="335" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#8F1F40">keine Schaltfläche, nur die Verwaltung storniert</text>

  <!-- Zeile 5: PayPal Checkout -->
  <text x="30" y="385" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" fill="#126365">PayPal Checkout</text>
  <text x="30" y="404" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">kein Schalter "Stornierbar"</text>
  <rect x="340" y="375" width="580" height="30" rx="8" fill="#FFFFFF" stroke="#8F1F40" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="630" y="395" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="13" fill="#8F1F40">keine Schaltfläche, nur die Verwaltung storniert</text>

  <!-- Fussnoten -->
  <text x="30" y="444" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Ohne Beginndatum im Durchführungszeitraum zeigt nur "Jederzeit" die Schaltfläche. Bei "Bis zum Beginndatum" und "Rechnung" fehlt sie ganz.</text>
  <text x="30" y="463" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">* Nur bei "Mit Gebühr": ab der Frist "Kostenlos stornierbar bis … Tage vor Start", ohne Frist schon ab der Buchung.</text>
  <text x="30" y="482" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Bei "Frei verfügbar" und "Zugangscode" gilt die aktuelle Einstellung des Angebots, bei "Rechnung" die Einstellung zum Zeitpunkt der Buchung.</text>
</svg>
