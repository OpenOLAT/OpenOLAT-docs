<svg width="940" height="460" viewBox="0 0 940 460" xmlns="http://www.w3.org/2000/svg" font-family="'Roboto', Arial, sans-serif">
  <title>A taxonomy with subjects on courses becomes tiles on the catalog start page and microsites</title>
  <defs>
    <marker id="arSea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#126365"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="460" fill="#FFFFFF"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#342C24">From the taxonomy tree to the catalog page</text>

  <!-- A: Taxonomie mit Kursen -->
  <rect x="20" y="56" width="250" height="330" rx="8" fill="#FFFFFF" stroke="#342C24" stroke-width="1.5"/>
  <rect x="20" y="56" width="250" height="36" rx="8" fill="#342C24"/>
  <rect x="20" y="78" width="250" height="14" fill="#342C24"/>
  <text x="145" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Taxonomy «Disciplines»</text>
  <g font-size="14" fill="#2D2926">
    <text x="40" y="124">Languages</text>
    <line x1="46" y1="130" x2="46" y2="184" stroke="#8A8580"/>
    <line x1="46" y1="154" x2="62" y2="154" stroke="#8A8580"/>
    <text x="68" y="159">German</text>
    <line x1="46" y1="184" x2="62" y2="184" stroke="#8A8580"/>
    <text x="68" y="189">English</text>
    <text x="40" y="234">STEM</text>
    <line x1="46" y1="240" x2="46" y2="294" stroke="#8A8580"/>
    <line x1="46" y1="264" x2="62" y2="264" stroke="#8A8580"/>
    <text x="68" y="269">Mathematics</text>
    <line x1="46" y1="294" x2="62" y2="294" stroke="#8A8580"/>
    <text x="68" y="299" fill="#8A8580">Biology</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="176" y="141" width="76" height="24" rx="12" fill="#E6F0F0" stroke="#126365"/>
    <text x="214" y="157" fill="#2D2926">1 course</text>
    <rect x="176" y="171" width="76" height="24" rx="12" fill="#E6F0F0" stroke="#126365"/>
    <text x="214" y="187" fill="#2D2926">2 courses</text>
    <rect x="176" y="251" width="76" height="24" rx="12" fill="#E6F0F0" stroke="#126365"/>
    <text x="214" y="267" fill="#2D2926">1 course</text>
    <rect x="176" y="281" width="76" height="24" rx="12" fill="#FFFFFF" stroke="#8A8580" stroke-dasharray="4 3"/>
    <text x="214" y="297" fill="#8A8580">no course</text>
  </g>
  <text x="145" y="346" text-anchor="middle" font-size="12" fill="#2D2926">Courses carry the levels</text>
  <text x="145" y="362" text-anchor="middle" font-size="12" fill="#2D2926">as subject</text>

  <!-- Pfeil A nach B -->
  <line x1="272" y1="220" x2="318" y2="220" stroke="#126365" stroke-width="1.8" marker-end="url(#arSea)"/>

  <!-- B: Startseite mit Launcher -->
  <rect x="320" y="56" width="270" height="330" rx="8" fill="#E6F0F0" stroke="#126365" stroke-width="1.5"/>
  <rect x="320" y="56" width="270" height="36" rx="8" fill="#126365"/>
  <rect x="320" y="78" width="270" height="14" fill="#126365"/>
  <text x="455" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Start page of the catalog</text>
  <text x="338" y="122" font-size="14" font-weight="bold" fill="#2D2926">Launcher «Disciplines»</text>
  <!-- Kachel Sprachen -->
  <rect x="338" y="134" width="114" height="88" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <rect x="339" y="135" width="112" height="54" rx="5" fill="#CFE3E3"/>
  <text x="395" y="166" text-anchor="middle" font-size="11" fill="#36464E">Teaser image</text>
  <text x="395" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Languages</text>
  <!-- Kachel MINT -->
  <rect x="460" y="134" width="114" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="2"/>
  <rect x="461" y="135" width="112" height="54" rx="5" fill="#CFE3E3"/>
  <text x="517" y="166" text-anchor="middle" font-size="11" fill="#36464E">Teaser image</text>
  <text x="517" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">STEM</text>
  <g font-size="12" fill="#2D2926">
    <text x="338" y="258">Launcher of the type «Taxonomy level»,</text>
    <text x="338" y="276">Type «Taxonomy», chosen «Disciplines»:</text>
    <text x="338" y="294">one tile per direct sublevel</text>
  </g>

  <!-- Pfeil B nach C -->
  <line x1="576" y1="178" x2="638" y2="178" stroke="#126365" stroke-width="1.8" marker-end="url(#arSea)"/>
  <text x="606" y="168" text-anchor="middle" font-size="12" fill="#2D2926">Click</text>

  <!-- C: Microsite -->
  <rect x="640" y="56" width="280" height="330" rx="8" fill="#E6F0F0" stroke="#126365" stroke-width="1.5"/>
  <rect x="640" y="56" width="280" height="36" rx="8" fill="#126365"/>
  <rect x="640" y="78" width="280" height="14" fill="#126365"/>
  <text x="780" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Microsite «STEM»</text>
  <rect x="656" y="104" width="248" height="46" rx="5" fill="#CFE3E3"/>
  <rect x="666" y="114" width="56" height="26" rx="4" fill="#FFFFFF"/>
  <text x="694" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">STEM</text>
  <text x="896" y="143" text-anchor="end" font-size="11" fill="#36464E">Background image</text>
  <text x="656" y="170" font-size="12" font-style="italic" fill="#36464E">Description of the level</text>
  <!-- Kachel Mathematik -->
  <rect x="656" y="182" width="118" height="58" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <rect x="657" y="183" width="116" height="30" rx="5" fill="#CFE3E3"/>
  <text x="715" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Mathematics</text>
  <!-- keine Kachel Biologie -->
  <rect x="786" y="182" width="118" height="58" rx="6" fill="#FFFFFF" stroke="#8A8580" stroke-dasharray="4 3"/>
  <text x="845" y="216" text-anchor="middle" font-size="13" fill="#8A8580">Biology</text>
  <text x="845" y="258" text-anchor="middle" font-size="12" fill="#5C5853">no tile: no course</text>
  <!-- Filter und Angebot -->
  <rect x="656" y="272" width="170" height="24" rx="4" fill="#126365"/>
  <text x="666" y="289" font-size="12" fill="#FFFFFF">Subjects ▾</text>
  <rect x="656" y="306" width="248" height="56" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <text x="670" y="328" font-size="13" font-weight="bold" fill="#2D2926">Course «Algebra»</text>
  <rect x="670" y="336" width="84" height="18" rx="9" fill="#FFFFFF" stroke="#126365"/>
  <text x="712" y="349" text-anchor="middle" font-size="11" fill="#126365">Mathematics</text>

  <!-- Regeln -->
  <rect x="20" y="404" width="900" height="44" rx="8" fill="#EDEDED"/>
  <text x="470" y="431" text-anchor="middle" font-size="14" fill="#36464E">Tiles only exist for levels with offers. Sequence: field «Order», then alphabetical.</text>
</svg>
