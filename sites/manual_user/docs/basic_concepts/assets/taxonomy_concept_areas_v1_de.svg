<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="'Roboto', Arial, sans-serif">
  <title>Wo eine Taxonomie wirkt</title>
  <defs>
    <marker id="arSea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#126365"/></marker>
    <marker id="arSpr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6E23"/></marker>
  </defs>
  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#342C24">Wo eine Taxonomie wirkt</text>
  <!-- Taxonomie mit Aufbau -->
  <rect x="190" y="50" width="560" height="102" rx="8" fill="#E6F0F0" stroke="#126365" stroke-width="1.5"/>
  <rect x="190" y="50" width="560" height="34" rx="8" fill="#126365"/>
  <rect x="190" y="70" width="560" height="14" fill="#126365"/>
  <text x="470" y="73" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Taxonomie</text>
  <rect x="228" y="96" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <text x="273" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Taxonomie</text>
  <text x="333" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#126365">›</text>
  <rect x="348" y="96" width="125" height="30" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <text x="411" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Taxonomieebene</text>
  <text x="489" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#126365">›</text>
  <rect x="504" y="96" width="87" height="30" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <text x="547" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Ebenentyp</text>
  <text x="606" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#126365">›</text>
  <rect x="621" y="96" width="91" height="30" rx="6" fill="#FFFFFF" stroke="#126365"/>
  <text x="666" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Kompetenz</text>
  <text x="470" y="140" text-anchor="middle" font-size="12" fill="#2D2926">mehrere Taxonomien nebeneinander möglich</text>
  <line x1="470" y1="152" x2="470" y2="190" stroke="#126365" stroke-width="1.5" marker-end="url(#arSea)"/>
  <text x="482" y="176" text-anchor="start" font-size="12" fill="#2D2926">wirkt erst, wenn Administrator:innen sie im Bereich auswählen</text>
  <!-- Bereiche in der Übersicht des Moduls Taxonomie -->
  <rect x="20" y="192" width="900" height="142" rx="8" fill="#E6F0F0" stroke="#126365" stroke-width="1.5"/>
  <text x="36" y="214" text-anchor="start" font-size="13" font-weight="bold" fill="#126365">In der Übersicht des Moduls Taxonomie, mit eigener Einstellung je Bereich</text>
  <rect x="36" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="110" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Media Center</text>
  <text x="110" y="279" text-anchor="middle" font-size="12" fill="#2D2926">Themen/Fachbereiche</text>
  <text x="110" y="295" text-anchor="middle" font-size="12" fill="#2D2926">von Medien</text>
  <rect x="248" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="322" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Lernressourcen /</text>
  <text x="322" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Katalog</text>
  <text x="322" y="287" text-anchor="middle" font-size="12" fill="#2D2926">Fachbereiche,</text>
  <text x="322" y="303" text-anchor="middle" font-size="12" fill="#2D2926">Launcher und Filter</text>
  <rect x="416" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="490" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Course Planner</text>
  <text x="490" y="279" text-anchor="middle" font-size="12" fill="#2D2926">Fachbereiche von</text>
  <text x="490" y="295" text-anchor="middle" font-size="12" fill="#2D2926">Durchführungen</text>
  <rect x="584" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="658" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">ePortfolio</text>
  <text x="658" y="279" text-anchor="middle" font-size="12" fill="#2D2926">Kompetenzen in</text>
  <text x="658" y="295" text-anchor="middle" font-size="12" fill="#2D2926">Portfolioeinträgen</text>
  <rect x="752" y="228" width="148" height="88" rx="6" fill="#FFFFFF" stroke="#126365" stroke-width="1.2"/>
  <text x="826" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Fragenpool</text>
  <text x="826" y="279" text-anchor="middle" font-size="12" fill="#2D2926">eigene Taxonomie,</text>
  <text x="826" y="295" text-anchor="middle" font-size="12" fill="#2D2926">nicht austauschbar</text>
  <line x1="186" y1="280" x2="246" y2="280" stroke="#126365" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arSea)"/>
  <text x="216" y="258" text-anchor="middle" font-size="11" fill="#2D2926">ohne</text>
  <text x="216" y="271" text-anchor="middle" font-size="11" fill="#2D2926">Auswahl</text>
  <!-- Bereiche ohne eigene Auswahl -->
  <rect x="20" y="420" width="900" height="120" rx="8" fill="#F4F7EA" stroke="#5F6E23" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="454" text-anchor="start" font-size="13" font-weight="bold" fill="#5F6E23">Ohne eigene Einstellung</text>
  <text x="36" y="474" text-anchor="start" font-size="12" fill="#2D2926">übernehmen die</text>
  <text x="36" y="490" text-anchor="start" font-size="12" fill="#2D2926">Taxonomien eines</text>
  <text x="36" y="506" text-anchor="start" font-size="12" fill="#2D2926">Bereichs oben</text>
  <rect x="222" y="440" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#5F6E23" stroke-width="1.2"/>
  <text x="302" y="467" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Termine</text>
  <text x="302" y="487" text-anchor="middle" font-size="12" fill="#2D2926">je nach Kurs oder</text>
  <text x="302" y="503" text-anchor="middle" font-size="12" fill="#2D2926">Durchführung</text>
  <rect x="422" y="440" width="176" height="80" rx="6" fill="#FFFFFF" stroke="#5F6E23" stroke-width="1.2"/>
  <text x="510" y="467" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Qualitätsmanagement</text>
  <text x="510" y="487" text-anchor="middle" font-size="12" fill="#2D2926">Fachbereiche des Kurses</text>
  <text x="510" y="503" text-anchor="middle" font-size="12" fill="#2D2926">oder des Elements</text>
  <rect x="746" y="440" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#5F6E23" stroke-width="1.2"/>
  <text x="826" y="467" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D2926">Kursbaustein «Übung»</text>
  <text x="826" y="487" text-anchor="middle" font-size="12" fill="#2D2926">Fachbereiche aus</text>
  <text x="826" y="503" text-anchor="middle" font-size="12" fill="#2D2926">dem Fragenpool</text>
  <g stroke="#5F6E23" stroke-width="1.5" fill="none">
    <line x1="322" y1="316" x2="322" y2="384"/>
    <line x1="490" y1="316" x2="490" y2="384"/>
    <line x1="302" y1="384" x2="510" y2="384"/>
    <line x1="302" y1="384" x2="302" y2="438" marker-end="url(#arSpr)"/>
    <line x1="510" y1="384" x2="510" y2="438" marker-end="url(#arSpr)"/>
    <line x1="826" y1="316" x2="826" y2="438" marker-end="url(#arSpr)"/>
  </g>
  <circle cx="322" cy="384" r="3" fill="#5F6E23"/>
  <circle cx="490" cy="384" r="3" fill="#5F6E23"/>
</svg>
