<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-labelledby="t2 d2">
  <title id="t2">One server with two addresses</title>
  <desc id="d2">The OpenOlat address learn.example.com and the content domain content.example.net point to the same OpenOlat server via the reverse proxy. The server knows both addresses. A subdomain of the OpenOlat address such as content.learn.example.com is not suitable as a content domain because it can share cookies with the OpenOlat address.</desc>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F5456"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="360" fill="#FFFFFF"/>

  <!-- Addresses -->
  <text x="40" y="44" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#342C24">Two addresses</text>

  <rect x="40" y="64" width="250" height="70" rx="8" fill="#126365"/>
  <text x="165" y="94" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">OpenOlat address</text>
  <text x="165" y="117" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#FFFFFF">learn.example.com</text>

  <rect x="40" y="160" width="250" height="70" rx="8" fill="#FFFFFF" stroke="#11624F" stroke-width="2"/>
  <text x="165" y="190" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#11624F">Content domain</text>
  <text x="165" y="213" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">content.example.net</text>

  <!-- Reverse Proxy -->
  <rect x="360" y="64" width="210" height="166" rx="8" fill="rgba(18, 99, 101, 0.12)" stroke="#126365" stroke-width="1.5"/>
  <text x="465" y="130" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#342C24">Reverse Proxy</text>
  <text x="465" y="153" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">one virtual host</text>
  <text x="465" y="173" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">per address</text>

  <!-- Server -->
  <rect x="640" y="64" width="260" height="166" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="2"/>
  <text x="770" y="100" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#126365">One OpenOlat server</text>
  <text x="770" y="126" text-anchor="middle" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">knows both addresses:</text>
  <text x="662" y="160" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">OpenOlat address</text>
  <text x="662" y="178" font-family="'Roboto', sans-serif" font-size="13" fill="#126365">= learn.example.com</text>
  <text x="662" y="202" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Content domain</text>
  <text x="662" y="220" font-family="'Roboto', sans-serif" font-size="13" fill="#11624F">= content.example.net</text>

  <!-- Arrows -->
  <line x1="290" y1="99" x2="356" y2="122" stroke="#0F5456" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="290" y1="195" x2="356" y2="172" stroke="#0F5456" stroke-width="2.5" marker-end="url(#arr2)"/>
  <line x1="570" y1="147" x2="636" y2="147" stroke="#0F5456" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- Not suitable -->
  <rect x="40" y="266" width="860" height="66" rx="8" fill="#FFFFFF" stroke="#8F1F40" stroke-width="2"/>
  <circle cx="76" cy="299" r="14" fill="#FFFFFF" stroke="#8F1F40" stroke-width="2.5"/>
  <line x1="69" y1="292" x2="83" y2="306" stroke="#8F1F40" stroke-width="2.5"/>
  <line x1="83" y1="292" x2="69" y2="306" stroke="#8F1F40" stroke-width="2.5"/>
  <text x="104" y="294" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#8F1F40">Not suitable: subdomain of the OpenOlat address, e.g. content.learn.example.com</text>
  <text x="104" y="316" font-family="'Roboto', sans-serif" font-size="14" fill="#2D2926">It can share cookies with the OpenOlat address. The content domain needs a domain of its own.</text>
</svg>
