<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 743 739" width="743" height="739" role="img" aria-labelledby="t d">
  <title id="t">My Media Center and Media management compared</title>
  <desc id="d">Comparison of the two segments of the Media Center. My Media Center contains your own media items and those shared with you, allows adding and deleting your own media items that are not embedded anywhere, and shows the storage indicator. Media management contains media items of other persons that are shared with courses of your organisation. It allows searching, filtering, viewing, removing shares and, with an editable share, downloading, but no adding and no deleting, and shows no storage indicator. It only appears for administrators and learning resource managers.</desc>
  <style>
    text { font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; fill: #2D2926; }
    .h1 { font-size: 22px; font-weight: 700; fill: #342C24; }
    .sub { font-size: 14px; }
    .colT { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .colS { font-size: 13px; fill: #FFFFFF; }
    .lab { font-size: 14px; font-weight: 700; fill: #126365; }
    .val { font-size: 14px; }
    .no { font-size: 14px; font-weight: 700; fill: #8F1F40; }
    .yes { font-size: 14px; font-weight: 700; fill: #2D2926; }
    .foot { font-size: 13px; }
  </style>
  <rect x="0" y="0" width="743" height="739" fill="#FFFFFF"/>
  <text x="26" y="48" class="h1">The two segments of the Media Center</text>
  <text x="26" y="74" class="sub">Your role decides which segment you see. You can only delete media items you created yourself.</text>
  <rect x="205" y="88" width="201" height="60" rx="8" fill="#2E8486"/>
  <text x="227" y="113" class="colT">My Media Center</text>
  <text x="227" y="134" class="colS">all roles</text>
  <rect x="426" y="88" width="291" height="60" rx="8" fill="#0F5456"/>
  <text x="448" y="113" class="colT">Media management</text>
  <text x="448" y="134" class="colS">Administrator, learning resource manager</text>
  <rect x="26" y="170" width="691" height="64" fill="rgba(18, 99, 101, 0.12)"/>
  <text x="26" y="190" class="lab">Content</text>
  <text x="227" y="190" class="val">Your own media items and</text>
  <text x="227" y="211" class="val">those shared with you</text>
  <text x="448" y="190" class="val">Media items of other persons, shared</text>
  <text x="448" y="211" class="val">with courses of your organisation</text>
  <line x1="26" y1="234" x2="717" y2="234" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="254" class="lab">Search and filter</text>
  <text x="227" y="254" class="yes">yes</text>
  <text x="448" y="254" class="yes">yes</text>
  <line x1="26" y1="277" x2="717" y2="277" stroke="#A6A6A6" stroke-width="1"/>
  <rect x="26" y="277" width="691" height="64" fill="rgba(18, 99, 101, 0.12)"/>
  <text x="26" y="297" class="lab">View usage</text>
  <text x="26" y="318" class="lab">and shares</text>
  <text x="227" y="297" class="yes">yes</text>
  <text x="448" y="297" class="yes">yes</text>
  <line x1="26" y1="341" x2="717" y2="341" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="361" class="lab">Remove share</text>
  <text x="227" y="361" class="yes">yes, if own or</text>
  <text x="227" y="382" class="val">shared as editable</text>
  <text x="448" y="361" class="yes">yes</text>
  <line x1="26" y1="405" x2="717" y2="405" stroke="#A6A6A6" stroke-width="1"/>
  <rect x="26" y="405" width="691" height="64" fill="rgba(18, 99, 101, 0.12)"/>
  <text x="26" y="425" class="lab">Download</text>
  <text x="227" y="425" class="yes">yes, if own or</text>
  <text x="227" y="446" class="val">shared as editable</text>
  <text x="448" y="425" class="yes">yes, if shared as editable</text>
  <line x1="26" y1="469" x2="717" y2="469" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="489" class="lab">Add</text>
  <text x="227" y="489" class="yes">yes</text>
  <text x="448" y="489" class="no">no</text>
  <line x1="26" y1="512" x2="717" y2="512" stroke="#A6A6A6" stroke-width="1"/>
  <rect x="26" y="512" width="691" height="64" fill="rgba(18, 99, 101, 0.12)"/>
  <text x="26" y="532" class="lab">Delete</text>
  <text x="227" y="532" class="yes">yes, own media items that</text>
  <text x="227" y="553" class="val">are not embedded anywhere</text>
  <text x="448" y="532" class="no">no, in no case</text>
  <line x1="26" y1="576" x2="717" y2="576" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="596" class="lab">Storage indicator</text>
  <text x="227" y="596" class="yes">yes</text>
  <text x="448" y="596" class="no">no</text>
  <line x1="26" y1="619" x2="717" y2="619" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="647" class="foot">Deleting requires that you are the creator of the media item yourself.</text>
  <text x="26" y="671" class="foot">Media management shows exactly the media items for which this is not the case: this is why</text>
  <text x="26" y="695" class="foot">the Delete button there never succeeds. A media item of another person can only be removed by its creator.</text>
  <text x="717" y="729" text-anchor="end" style="font-size:11px; fill:#A6A6A6">OpenOlat ∞ Media Center</text>
</svg>
