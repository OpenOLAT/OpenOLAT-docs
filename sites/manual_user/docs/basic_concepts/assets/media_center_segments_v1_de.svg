<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 743 739" width="743" height="739" role="img" aria-labelledby="t d">
  <title id="t">Mein Media Center und Medienverwaltung im Vergleich</title>
  <desc id="d">Vergleich der zwei Segmente des Media Centers. Mein Media Center enthält die eigenen und die für Sie freigegebenen Medien, erlaubt Hinzufügen und Löschen eigener, nirgends eingebundener Medien und zeigt die Speicheranzeige. Die Medienverwaltung enthält Medien anderer Personen, die an Kurse Ihrer Organisation freigegeben sind. Sie erlaubt Suchen, Filtern, Einsehen, Entfernen von Freigaben und bei bearbeitbarer Freigabe Herunterladen, aber kein Hinzufügen und kein Löschen, und zeigt keine Speicheranzeige. Sie erscheint nur für Administrator:innen und Lernressourcenverwalter:innen.</desc>
  <style>
    text { font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; fill: #2D2926; }
    .h1 { font-size: 22px; font-weight: 700; fill: #342C24; }
    .sub { font-size: 14px; }
    .colT { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .colS { font-size: 13px; fill: #FFFFFF; }
    .lab { font-size: 14px; font-weight: 700; fill: #126365; }
    .val { font-size: 14px; }
    .no { font-size: 14px; font-weight: 700; fill: #8F1F40; }
    .yes { font-size: 14px; font-weight: 700; fill: #2D2926; }
    .foot { font-size: 13px; }
  </style>
  <rect x="0" y="0" width="743" height="739" fill="#FFFFFF"/>
  <text x="26" y="48" class="h1">Die zwei Segmente des Media Centers</text>
  <text x="26" y="74" class="sub">Welches Segment Sie sehen, entscheidet Ihre Rolle. Löschen können Sie nur selbst erstellte Medien.</text>
  <rect x="205" y="88" width="201" height="60" rx="8" fill="#2E8486"/>
  <text x="227" y="113" class="colT">Mein Media Center</text>
  <text x="227" y="134" class="colS">alle Rollen</text>
  <rect x="426" y="88" width="291" height="60" rx="8" fill="#0F5456"/>
  <text x="448" y="113" class="colT">Medienverwaltung</text>
  <text x="448" y="134" class="colS">Administrator:in, Lernressourcenverwalter:in</text>
  <rect x="26" y="170" width="691" height="64" fill="rgba(18, 99, 101, 0.12)"/>
  <text x="26" y="190" class="lab">Inhalt</text>
  <text x="227" y="190" class="val">Ihre eigenen und die für</text>
  <text x="227" y="211" class="val">Sie freigegebenen Medien</text>
  <text x="448" y="190" class="val">Medien anderer Personen, an Kurse</text>
  <text x="448" y="211" class="val">Ihrer Organisation freigegeben</text>
  <line x1="26" y1="234" x2="717" y2="234" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="254" class="lab">Suchen und filtern</text>
  <text x="227" y="254" class="yes">ja</text>
  <text x="448" y="254" class="yes">ja</text>
  <line x1="26" y1="277" x2="717" y2="277" stroke="#A6A6A6" stroke-width="1"/>
  <rect x="26" y="277" width="691" height="64" fill="rgba(18, 99, 101, 0.12)"/>
  <text x="26" y="297" class="lab">Verwendung und</text>
  <text x="26" y="318" class="lab">Freigaben einsehen</text>
  <text x="227" y="297" class="yes">ja</text>
  <text x="448" y="297" class="yes">ja</text>
  <line x1="26" y1="341" x2="717" y2="341" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="361" class="lab">Freigabe entfernen</text>
  <text x="227" y="361" class="yes">ja, wenn eigen oder</text>
  <text x="227" y="382" class="val">bearbeitbar freigegeben</text>
  <text x="448" y="361" class="yes">ja</text>
  <line x1="26" y1="405" x2="717" y2="405" stroke="#A6A6A6" stroke-width="1"/>
  <rect x="26" y="405" width="691" height="64" fill="rgba(18, 99, 101, 0.12)"/>
  <text x="26" y="425" class="lab">Herunterladen</text>
  <text x="227" y="425" class="yes">ja, wenn eigen oder</text>
  <text x="227" y="446" class="val">bearbeitbar freigegeben</text>
  <text x="448" y="425" class="yes">ja, wenn bearbeitbar freigegeben</text>
  <line x1="26" y1="469" x2="717" y2="469" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="489" class="lab">Hinzufügen</text>
  <text x="227" y="489" class="yes">ja</text>
  <text x="448" y="489" class="no">nein</text>
  <line x1="26" y1="512" x2="717" y2="512" stroke="#A6A6A6" stroke-width="1"/>
  <rect x="26" y="512" width="691" height="64" fill="rgba(18, 99, 101, 0.12)"/>
  <text x="26" y="532" class="lab">Löschen</text>
  <text x="227" y="532" class="yes">ja, eigene Medien, die</text>
  <text x="227" y="553" class="val">nirgends eingebunden sind</text>
  <text x="448" y="532" class="no">nein, in keinem Fall</text>
  <line x1="26" y1="576" x2="717" y2="576" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="596" class="lab">Speicheranzeige</text>
  <text x="227" y="596" class="yes">ja</text>
  <text x="448" y="596" class="no">nein</text>
  <line x1="26" y1="619" x2="717" y2="619" stroke="#A6A6A6" stroke-width="1"/>
  <text x="26" y="647" class="foot">Löschen setzt voraus, dass Sie selbst Ersteller:in des Mediums sind.</text>
  <text x="26" y="671" class="foot">Die Medienverwaltung zeigt genau die Medien, bei denen das nicht der Fall ist: deshalb</text>
  <text x="26" y="695" class="foot">führt der Löschen-Button dort nie zum Erfolg. Ein fremdes Medium entfernt nur dessen Ersteller:in.</text>
  <text x="717" y="729" text-anchor="end" style="font-size:11px; fill:#A6A6A6">OpenOlat ∞ Media Center</text>
</svg>
