<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Guide to six login problems in OpenOlat: ways you can try yourself first, and after that your organisation as the responsible body">
  <rect x="0" y="0" width="1000" height="700" rx="0" fill="#F3F4EF"/>
  <text x="30" y="42" font-family="'Roboto', sans-serif" font-size="21" font-weight="700" fill="#135E5F">I cannot get into OpenOlat</text>
  <text x="30" y="68" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926">Have you already tried these ways? Your organisation determines which of them exist.</text>
  <text x="30" y="94" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#A6A6A6">YOUR CASE</text>
  <text x="340" y="94" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#A6A6A6">TRY THIS FIRST</text>
  <text x="640" y="94" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#A6A6A6">IF THAT DOES NOT HELP</text>
  <rect x="340" y="106" width="250" height="452" rx="8" fill="#FFFFFF" stroke="#B2CF42" stroke-width="2.5"/>
  <rect x="30" y="106" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="46" y="131" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#135E5F">Password forgotten</text>
  <text x="46" y="152" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">You no longer know your password</text>
  <text x="356" y="131" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#135E5F">Start «Forgot password?»,</text>
  <text x="356" y="152" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">if your login page shows the link</text>
  <path d="M290 137 H332" stroke="#A6A6A6" stroke-width="2" fill="none"/>
  <polygon points="338,137 326,131 326,143" fill="#A6A6A6"/>
  <rect x="30" y="184" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="46" y="209" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#135E5F">No e-mail with a code</text>
  <text x="46" y="230" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">The validation code does not arrive</text>
  <text x="356" y="209" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#135E5F">«Resend validation code»</text>
  <text x="356" y="230" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">and check the spam folder</text>
  <path d="M290 215 H332" stroke="#A6A6A6" stroke-width="2" fill="none"/>
  <polygon points="338,215 326,209 326,221" fill="#A6A6A6"/>
  <rect x="30" y="262" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="46" y="287" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#135E5F">No credentials</text>
  <text x="46" y="308" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">You never received an account</text>
  <text x="356" y="287" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#135E5F">Use «Register here»,</text>
  <text x="356" y="308" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">if your login page shows the link</text>
  <path d="M290 293 H332" stroke="#A6A6A6" stroke-width="2" fill="none"/>
  <polygon points="338,293 326,287 326,299" fill="#A6A6A6"/>
  <rect x="30" y="340" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="46" y="365" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#135E5F">Login fails</text>
  <text x="46" y="386" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">Page «Authentication not successful»</text>
  <text x="356" y="365" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#135E5F">Read the message on the error page,</text>
  <text x="356" y="386" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">the table on the page names the way</text>
  <path d="M290 371 H332" stroke="#A6A6A6" stroke-width="2" fill="none"/>
  <polygon points="338,371 326,365 326,377" fill="#A6A6A6"/>
  <rect x="30" y="418" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="46" y="443" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#135E5F">Account blocked or new</text>
  <text x="46" y="464" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">Message «deactivated» or «not activated»</text>
  <text x="356" y="443" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#135E5F">No way to solve it yourself,</text>
  <text x="356" y="464" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">go straight to your organisation</text>
  <path d="M290 449 H332" stroke="#A6A6A6" stroke-width="2" fill="none"/>
  <polygon points="338,449 326,443 326,455" fill="#A6A6A6"/>
  <rect x="30" y="496" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="46" y="521" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#135E5F">Username or password wrong</text>
  <text x="46" y="542" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">The entry is rejected</text>
  <text x="356" y="521" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#135E5F">Check the username, it is not</text>
  <text x="356" y="542" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#2D2926">necessarily your e-mail address</text>
  <path d="M290 527 H332" stroke="#A6A6A6" stroke-width="2" fill="none"/>
  <polygon points="338,527 326,521 326,533" fill="#A6A6A6"/>
  <path d="M590 332 H630" stroke="#135E5F" stroke-width="3" fill="none"/>
  <polygon points="640,332 626,325 626,339" fill="#135E5F"/>
  <rect x="640" y="106" width="330" height="452" rx="10" fill="#135E5F"/>
  <text x="660" y="144" font-family="'Roboto', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Your organisation</text>
  <text x="660" y="176" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">This is the body that gave you the</text>
  <text x="660" y="197" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">access to OpenOlat:</text>
  <text x="660" y="228" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#B2CF42">Your school, university or company</text>
  <text x="660" y="251" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#B2CF42">Your public administration or training provider</text>
  <text x="660" y="274" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#B2CF42">Your IT or student administration</text>
  <line x1="660" y1="300" x2="950" y2="300" stroke="#209D9E" stroke-width="1.5"/>
  <text x="660" y="330" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#F2AF40">Not frentix, not this manual.</text>
  <text x="660" y="358" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">Your organisation decides which ways</text>
  <text x="660" y="379" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">exist. As long as you cannot get in,</text>
  <text x="660" y="400" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">only it can set up an account for you,</text>
  <text x="660" y="421" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">unblock it or change your e-mail</text>
  <text x="660" y="442" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">address.</text>
  <text x="660" y="478" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Only it knows how you can reach it.</text>
  <text x="660" y="502" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">Check «Do you need help?» and the page</text>
  <text x="660" y="523" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">footer of the login page: it can store</text>
  <text x="660" y="544" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">its contact details there.</text>
  <text x="30" y="610" font-family="'Roboto', sans-serif" font-size="12.5" font-weight="400" fill="#2D2926">The login page looks different at every organisation. If a link is missing on your login page, that way does not exist for you.</text>
  <text x="30" y="640" font-family="'Roboto', sans-serif" font-size="11" font-weight="400" fill="#A6A6A6">OpenOlat manual, Login and Registration</text>
</svg>
