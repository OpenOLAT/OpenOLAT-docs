<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="Steps and branches in the wizard Set login credentials">
  <rect x="0" y="0" width="940" height="520" fill="#F3F4EF"/>
  <text x="30" y="42" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" fill="#135E5F">Wizard «Set login credentials»</text>
  <text x="30" y="66" font-family="'Roboto', sans-serif" font-size="13" fill="#2D2926">Which steps you see depends on your account.</text>

  <rect x="30" y="100" width="175" height="76" rx="8" fill="#209D9E"/>
  <text x="46" y="126" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1 Authentication</text>
  <text x="46" y="148" font-family="'Roboto', sans-serif" font-size="12" fill="#FFFFFF">E-mail address or</text>
  <text x="46" y="166" font-family="'Roboto', sans-serif" font-size="12" fill="#FFFFFF">username</text>

  <rect x="250" y="100" width="205" height="76" rx="8" fill="#FFFFFF" stroke="#209D9E" stroke-width="2"/>
  <text x="266" y="126" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#135E5F">2 Select Validation Type</text>
  <text x="266" y="148" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">«via E-Mail» or «via Sms»</text>
  <text x="266" y="167" font-family="'Roboto', sans-serif" font-size="11" fill="#A6A6A6">only if both are stored</text>

  <rect x="500" y="100" width="175" height="76" rx="8" fill="#209D9E"/>
  <text x="516" y="126" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3 Validation</text>
  <text x="516" y="148" font-family="'Roboto', sans-serif" font-size="12" fill="#FFFFFF">Validation code,</text>
  <text x="516" y="166" font-family="'Roboto', sans-serif" font-size="12" fill="#FFFFFF">resending possible</text>

  <rect x="725" y="100" width="185" height="76" rx="8" fill="#B2CF42"/>
  <text x="741" y="126" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#2D2926">4 Set login credentials</text>
  <text x="741" y="148" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Assign new</text>
  <text x="741" y="166" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">password</text>

  <g stroke="#135E5F" stroke-width="2.5" fill="none">
    <path d="M205 138 H242"/>
    <path d="M455 138 H492"/>
    <path d="M675 138 H717"/>
  </g>
  <polygon points="248,138 236,132 236,144" fill="#135E5F"/>
  <polygon points="498,138 486,132 486,144" fill="#135E5F"/>
  <polygon points="723,138 711,132 711,144" fill="#135E5F"/>

  <path d="M145 176 V228 H587 V184" stroke="#A6A6A6" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <polygon points="587,178 581,190 593,190" fill="#A6A6A6"/>
  <text x="200" y="222" font-family="'Roboto', sans-serif" font-size="11.5" fill="#2D2926">only e-mail address or only mobile number stored: step 2 is omitted</text>

  <rect x="30" y="278" width="420" height="160" rx="8" fill="#FFFFFF" stroke="#F2AF40" stroke-width="2.5"/>
  <text x="46" y="304" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#135E5F">Instead: step «Contact support»</text>
  <text x="46" y="328" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Your account does not allow your own password, or it</text>
  <text x="46" y="347" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">has neither an e-mail address nor a mobile number.</text>
  <text x="46" y="374" font-family="'Roboto', sans-serif" font-size="12" font-style="italic" fill="#2D2926">«To change your password, please contact the support</text>
  <text x="46" y="392" font-family="'Roboto', sans-serif" font-size="12" font-style="italic" fill="#2D2926">team at your university.»</text>
  <text x="46" y="422" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#135E5F">This means the support of your organisation.</text>

  <path d="M90 176 V272" stroke="#F2AF40" stroke-width="2.5" fill="none"/>
  <polygon points="90,278 83,266 97,266" fill="#F2AF40"/>

  <rect x="490" y="278" width="420" height="160" rx="8" fill="#FFFFFF" stroke="#8F1F40" stroke-width="2.5"/>
  <text x="506" y="304" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" fill="#135E5F">Special case: account with passkey</text>
  <text x="506" y="328" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">The e-mail contains no validation code, but the note</text>
  <text x="506" y="347" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">to use a recovery key or to contact the support</text>
  <text x="506" y="366" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">centre.</text>
  <text x="506" y="394" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">Without a recovery key, only the support of your</text>
  <text x="506" y="413" font-family="'Roboto', sans-serif" font-size="12" fill="#2D2926">organisation can help.</text>

  <text x="30" y="478" font-family="'Roboto', sans-serif" font-size="11" fill="#A6A6A6">OpenOlat manual, Login and Registration</text>
</svg>
