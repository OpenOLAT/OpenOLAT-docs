<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" width="1100" height="810" role="img" aria-label="Timeline of an exam: assessment mode with prep time and follow-up, test period and time limit. For one person with extra time, the test and the assessment mode end later.">
<rect x="0" y="0" width="1100" height="810" rx="0" fill="#F3F4EF"/>
<text x="30" y="48" font-family="'Roboto', Arial, sans-serif" font-size="26" font-weight="700" fill="#126365" text-anchor="start">The times of an exam at a glance</text>
<text x="30" y="80" font-family="'Roboto', Arial, sans-serif" font-size="18" fill="#2D2926" text-anchor="start">Extra time* moves the end for one person, in the test and in the assessment mode.</text>
<text x="30" y="110" font-family="'Roboto', Arial, sans-serif" font-size="15" font-weight="700" fill="#6E6E6E" text-anchor="start">FOR ALL PARTICIPANTS</text>
<line x1="30" y1="118" x2="1070" y2="118" stroke="#C9CCC0" stroke-width="1"/>
<text x="30" y="170" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="700" fill="#126365" text-anchor="start">Assessment mode</text>
<text x="30" y="189" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="start">Assessment management</text>
<rect x="326.6666666666667" y="150" width="66.66666666666669" height="44" rx="6" fill="#2E8486" stroke="#126365" stroke-width="1.5" opacity="0.45"/>
<rect x="393.33333333333337" y="150" width="400.0" height="44" rx="6" fill="#126365" stroke="#126365" stroke-width="1.5"/>
<rect x="793.3333333333334" y="150" width="66.66666666666663" height="44" rx="6" fill="#2E8486" stroke="#126365" stroke-width="1.5" opacity="0.45"/>
<text x="593.3333333333334" y="178" font-family="'Roboto', Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">Only the exam is accessible</text>
<text x="360.0" y="144" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#126365" text-anchor="middle">Prep time</text>
<text x="826.6666666666667" y="144" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#126365" text-anchor="middle">Follow-up</text>
<text x="30" y="240" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="700" fill="#126365" text-anchor="start">Test period</text>
<text x="30" y="259" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="start">Course element Test</text>
<rect x="393.33333333333337" y="220" width="400.0" height="44" rx="8" fill="#9FD3D4" stroke="#126365" stroke-width="1.5"/>
<text x="593.3333333333334" y="248" font-family="'Roboto', Arial, sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">Start and work on the test</text>
<text x="30" y="310" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="700" fill="#126365" text-anchor="start">Time limit</text>
<text x="30" y="329" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="start">Learning resource or course element</text>
<rect x="393.33333333333337" y="290" width="400.0" height="44" rx="8" fill="#F2AF40" stroke="#B87A12" stroke-width="1.5"/>
<text x="593.3333333333334" y="318" font-family="'Roboto', Arial, sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">60 minutes per test run</text>
<text x="30" y="380" font-family="'Roboto', Arial, sans-serif" font-size="15" font-weight="700" fill="#6E6E6E" text-anchor="start">FOR ONE PERSON WITH 20 MINUTES OF EXTRA TIME</text>
<line x1="30" y1="388" x2="1070" y2="388" stroke="#C9CCC0" stroke-width="1"/>
<text x="30" y="420" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="700" fill="#126365" text-anchor="start">Test run</text>
<text x="30" y="439" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="start">runs longer</text>
<rect x="393.33333333333337" y="400" width="400.0" height="44" rx="8" fill="#F2AF40" stroke="#B87A12" stroke-width="1.5"/>
<text x="593.3333333333334" y="428" font-family="'Roboto', Arial, sans-serif" font-size="16" fill="#2D2926" text-anchor="middle">60 minutes</text>
<rect x="793.3333333333334" y="400" width="133.33333333333337" height="44" rx="8" fill="#F9DDAE" stroke="#B87A12" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="860.0" y="428" font-family="'Roboto', Arial, sans-serif" font-size="16" font-weight="700" fill="#916926" text-anchor="middle">+ 20 min.</text>
<text x="30" y="490" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="700" fill="#126365" text-anchor="start">Assessment mode</text>
<text x="30" y="509" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="start">stays active longer</text>
<rect x="326.6666666666667" y="470" width="66.66666666666669" height="44" rx="6" fill="#2E8486" stroke="#126365" stroke-width="1.5" opacity="0.45"/>
<rect x="393.33333333333337" y="470" width="533.3333333333334" height="44" rx="6" fill="#126365" stroke="#126365" stroke-width="1.5"/>
<rect x="926.6666666666667" y="470" width="66.66666666666663" height="44" rx="6" fill="#2E8486" stroke="#126365" stroke-width="1.5" opacity="0.45"/>
<text x="660.0" y="498" font-family="'Roboto', Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">Only the exam is accessible</text>
<line x1="793.3333333333334" y1="145" x2="793.3333333333334" y2="530" stroke="#0F5456" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="926.6666666666667" y1="145" x2="926.6666666666667" y2="530" stroke="#916926" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="260" y1="560" x2="1060" y2="560" stroke="#A6A6A6" stroke-width="2"/>
<text x="30" y="565" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="start">Example</text>
<line x1="393.33333333333337" y1="554" x2="393.33333333333337" y2="566" stroke="#A6A6A6" stroke-width="2"/>
<text x="393.33333333333337" y="584" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="middle">09:00</text>
<line x1="793.3333333333334" y1="554" x2="793.3333333333334" y2="566" stroke="#A6A6A6" stroke-width="2"/>
<text x="793.3333333333334" y="584" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="middle">10:00</text>
<line x1="926.6666666666667" y1="554" x2="926.6666666666667" y2="566" stroke="#A6A6A6" stroke-width="2"/>
<text x="926.6666666666667" y="584" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="middle">10:20</text>
<text x="815.3333333333334" y="604" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="700" fill="#0F5456" text-anchor="end">End for everyone</text>
<text x="904.6666666666667" y="604" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="700" fill="#916926" text-anchor="start">End with extra time</text>
<rect x="30" y="630" width="1040" height="125" rx="10" fill="#FFFFFF" stroke="#126365" stroke-width="1.5"/>
<text x="54" y="664" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="700" fill="#126365" text-anchor="start">Extra time comes in two ways in the assessment tool</text>
<text x="54" y="700" font-family="'Roboto', Arial, sans-serif" font-size="17" font-weight="700" fill="#2D2926" text-anchor="start">Disadvantage compensation</text>
<text x="54" y="726" font-family="'Roboto', Arial, sans-serif" font-size="16" fill="#2D2926" text-anchor="start">Applies to every test run of the person</text>
<text x="570" y="700" font-family="'Roboto', Arial, sans-serif" font-size="17" font-weight="700" fill="#2D2926" text-anchor="start">Extension</text>
<text x="570" y="726" font-family="'Roboto', Arial, sans-serif" font-size="16" fill="#2D2926" text-anchor="start">Applies only to the ongoing test run</text>
<text x="1046" y="664" font-family="'Roboto', Arial, sans-serif" font-size="15" fill="#6E6E6E" text-anchor="end">Both add up.</text>
<text x="30" y="788" font-family="'Roboto', Arial, sans-serif" font-size="14" fill="#6E6E6E" text-anchor="start">* Umbrella term for both ways. In OpenOlat they are called “Add disadvantage compensation” and “Extend test time”.</text>
</svg>
