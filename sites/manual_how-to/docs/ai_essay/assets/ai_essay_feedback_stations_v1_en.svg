<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 606" width="960" height="606" role="img" aria-label="Four stations, three words in the interface for one function: AI feedback on free-text answers">
  <rect x="0" y="0" width="960" height="606" fill="#F3F4EF"/>
  <text x="30" y="50" font-family="'Roboto', sans-serif" font-size="24" font-weight="700" fill="#126365" text-anchor="start">AI feedback on free-text answers</text>
  <text x="30" y="78" font-family="'Roboto', sans-serif" font-size="15" font-weight="400" fill="#2D2926" text-anchor="start">Four stations: who meets the function where, and what it does there</text>
  <g transform="translate(30,104)">
    <rect x="0" y="0" width="204" height="382" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="1"/>
    <path d="M0,10 a10,10 0 0 1 10,-10 h184 a10,10 0 0 1 10,10 v34 h-204 z" fill="#126365"/>
    <text x="14" y="28" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">System administrator</text>
    <text x="14" y="70" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WHERE</text>
    <rect x="14" y="80" width="176" height="64" rx="6" fill="#EDEDED"/>
    <text x="22" y="100" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">Administration &gt;</text>
    <text x="22" y="118" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">External tools &gt;</text>
    <text x="22" y="136" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">AI module</text>
    <text x="14" y="170" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WORD IN THE INTERFACE</text>
    <rect x="14" y="180" width="176" height="52" rx="6" fill="#F2AF40"/>
    <text x="22" y="212.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">Essay Grading</text>
    <text x="14" y="250" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#767676" text-anchor="start">In the tab "AI Features"</text>
    <text x="14" y="280" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">EFFECT</text>
    <text x="14" y="300" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Switches the function on in</text>
    <text x="14" y="319" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">OpenOlat for everyone.</text>
  </g>
  <path d="M242.0,117 L254.0,126 L242.0,135 z" fill="#342C24"/>
  <g transform="translate(262,104)">
    <rect x="0" y="0" width="204" height="382" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="1"/>
    <path d="M0,10 a10,10 0 0 1 10,-10 h184 a10,10 0 0 1 10,10 v34 h-204 z" fill="#5F6E23"/>
    <text x="14" y="28" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Author</text>
    <text x="14" y="70" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WHERE</text>
    <rect x="14" y="80" width="176" height="46" rx="6" fill="#EDEDED"/>
    <text x="22" y="100" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">Question bank &gt;</text>
    <text x="22" y="118" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">AI questions</text>
    <text x="14" y="170" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WORD IN THE INTERFACE</text>
    <rect x="14" y="180" width="176" height="52" rx="6" fill="#F2AF40"/>
    <text x="22" y="202.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">Essay questions with</text>
    <text x="22" y="222.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">AI correction</text>
    <text x="14" y="250" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#767676" text-anchor="start">Field in the dialog</text>
    <text x="14" y="280" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">EFFECT</text>
    <text x="14" y="300" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Creates essay questions</text>
    <text x="14" y="319" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">with a prefilled grading kit on</text>
    <text x="14" y="338" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">request.</text>
  </g>
  <path d="M474.0,117 L486.0,126 L474.0,135 z" fill="#342C24"/>
  <g transform="translate(494,104)">
    <rect x="0" y="0" width="204" height="382" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="1"/>
    <path d="M0,10 a10,10 0 0 1 10,-10 h184 a10,10 0 0 1 10,10 v34 h-204 z" fill="#5F6E23"/>
    <text x="14" y="28" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Author</text>
    <text x="14" y="70" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WHERE</text>
    <text x="14" y="96" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">Essay question in the question</text>
    <text x="14" y="114" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">bank or in the quiz of a page</text>
    <text x="14" y="170" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WORD IN THE INTERFACE</text>
    <rect x="14" y="180" width="176" height="52" rx="6" fill="#F2AF40"/>
    <text x="22" y="212.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">AI feedback</text>
    <text x="14" y="250" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#767676" text-anchor="start">Tab of the question</text>
    <text x="14" y="280" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">EFFECT</text>
    <text x="14" y="300" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Defines in the grading kit</text>
    <text x="14" y="319" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">what the AI measures an</text>
    <text x="14" y="338" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">answer against.</text>
  </g>
  <path d="M706.0,117 L718.0,126 L706.0,135 z" fill="#342C24"/>
  <g transform="translate(726,104)">
    <rect x="0" y="0" width="204" height="382" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="1"/>
    <path d="M0,10 a10,10 0 0 1 10,-10 h184 a10,10 0 0 1 10,10 v34 h-204 z" fill="#916926"/>
    <text x="14" y="28" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Participant</text>
    <text x="14" y="70" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WHERE</text>
    <text x="14" y="96" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">At the start of the quiz,</text>
    <text x="14" y="114" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">later in the tab</text>
    <text x="14" y="132" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">"AI settings"</text>
    <text x="14" y="170" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WORD IN THE INTERFACE</text>
    <rect x="14" y="180" width="176" height="52" rx="6" fill="#F2AF40"/>
    <text x="22" y="212.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">AI correction</text>
    <text x="14" y="250" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#767676" text-anchor="start">Consent dialog</text>
    <text x="14" y="280" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">EFFECT</text>
    <text x="14" y="300" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Allows or refuses the</text>
    <text x="14" y="319" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">feedback. Then the</text>
    <text x="14" y="338" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">feedback on the answer</text>
    <text x="14" y="357" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">appears.</text>
  </g>
  <rect x="30" y="510" width="900" height="72" rx="8" fill="#B2CF42"/>
  <text x="480.0" y="540" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#2D2926" text-anchor="middle">The words mean the same function: the AI gives feedback on free-text answers.</text>
  <text x="480.0" y="566" font-family="'Roboto', sans-serif" font-size="15" font-weight="400" fill="#2D2926" text-anchor="middle">"Essay Grading"  ·  "AI correction"  ·  "AI feedback"</text>
</svg>
