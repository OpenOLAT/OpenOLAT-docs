<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 606" width="960" height="606" role="img" aria-label="Vier Stationen, drei Wörter der Oberfläche für eine Funktion: KI-Feedback zu Freitextantworten">
  <rect x="0" y="0" width="960" height="606" fill="#F3F4EF"/>
  <text x="30" y="50" font-family="'Roboto', sans-serif" font-size="24" font-weight="700" fill="#126365" text-anchor="start">KI-Feedback zu Freitextantworten</text>
  <text x="30" y="78" font-family="'Roboto', sans-serif" font-size="15" font-weight="400" fill="#2D2926" text-anchor="start">Vier Stationen: wer die Funktion wo antrifft und was sie dort bewirkt</text>
  <g transform="translate(30,104)">
    <rect x="0" y="0" width="204" height="382" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="1"/>
    <path d="M0,10 a10,10 0 0 1 10,-10 h184 a10,10 0 0 1 10,10 v34 h-204 z" fill="#126365"/>
    <text x="14" y="28" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Systemadministrator:in</text>
    <text x="14" y="70" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WO</text>
    <rect x="14" y="80" width="176" height="64" rx="6" fill="#EDEDED"/>
    <text x="22" y="100" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">Administration &gt;</text>
    <text x="22" y="118" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">Externe Werkzeuge &gt;</text>
    <text x="22" y="136" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">KI-Modul</text>
    <text x="14" y="170" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WORT DER OBERFLÄCHE</text>
    <rect x="14" y="180" width="176" height="52" rx="6" fill="#F2AF40"/>
    <text x="22" y="212.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">Essay Bewertung</text>
    <text x="14" y="250" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#767676" text-anchor="start">Im Tab "KI-Funktionen"</text>
    <text x="14" y="280" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WIRKUNG</text>
    <text x="14" y="300" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Schaltet die Funktion in</text>
    <text x="14" y="319" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">OpenOlat für alle ein.</text>
  </g>
  <path d="M242.0,117 L254.0,126 L242.0,135 z" fill="#342C24"/>
  <g transform="translate(262,104)">
    <rect x="0" y="0" width="204" height="382" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="1"/>
    <path d="M0,10 a10,10 0 0 1 10,-10 h184 a10,10 0 0 1 10,10 v34 h-204 z" fill="#5F6E23"/>
    <text x="14" y="28" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Autor:in</text>
    <text x="14" y="70" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WO</text>
    <rect x="14" y="80" width="176" height="46" rx="6" fill="#EDEDED"/>
    <text x="22" y="100" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">Fragenpool &gt;</text>
    <text x="22" y="118" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" font-weight="400" fill="#36464E" text-anchor="start">KI Fragen</text>
    <text x="14" y="170" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WORT DER OBERFLÄCHE</text>
    <rect x="14" y="180" width="176" height="52" rx="6" fill="#F2AF40"/>
    <text x="22" y="202.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">Essay-Fragen mit</text>
    <text x="22" y="222.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">KI-Korrektur</text>
    <text x="14" y="250" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#767676" text-anchor="start">Feld im Dialog</text>
    <text x="14" y="280" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WIRKUNG</text>
    <text x="14" y="300" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Erzeugt auf Wunsch</text>
    <text x="14" y="319" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Freitextfragen mit</text>
    <text x="14" y="338" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">vorgefülltem Bewertungskit.</text>
  </g>
  <path d="M474.0,117 L486.0,126 L474.0,135 z" fill="#342C24"/>
  <g transform="translate(494,104)">
    <rect x="0" y="0" width="204" height="382" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="1"/>
    <path d="M0,10 a10,10 0 0 1 10,-10 h184 a10,10 0 0 1 10,10 v34 h-204 z" fill="#5F6E23"/>
    <text x="14" y="28" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Autor:in</text>
    <text x="14" y="70" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WO</text>
    <text x="14" y="96" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">Freitextfrage im Fragenpool</text>
    <text x="14" y="114" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">oder im Quiz einer Seite</text>
    <text x="14" y="170" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WORT DER OBERFLÄCHE</text>
    <rect x="14" y="180" width="176" height="52" rx="6" fill="#F2AF40"/>
    <text x="22" y="212.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">KI-Feedback</text>
    <text x="14" y="250" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#767676" text-anchor="start">Tab der Frage</text>
    <text x="14" y="280" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WIRKUNG</text>
    <text x="14" y="300" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Legt im Bewertungskit fest,</text>
    <text x="14" y="319" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">woran die KI eine Antwort</text>
    <text x="14" y="338" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">misst.</text>
  </g>
  <path d="M706.0,117 L718.0,126 L706.0,135 z" fill="#342C24"/>
  <g transform="translate(726,104)">
    <rect x="0" y="0" width="204" height="382" rx="10" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="1"/>
    <path d="M0,10 a10,10 0 0 1 10,-10 h184 a10,10 0 0 1 10,10 v34 h-204 z" fill="#916926"/>
    <text x="14" y="28" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Teilnehmer:in</text>
    <text x="14" y="70" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WO</text>
    <text x="14" y="96" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">Beim Start des Quiz,</text>
    <text x="14" y="114" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">später im Tab</text>
    <text x="14" y="132" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#2D2926" text-anchor="start">"KI-Einstellungen"</text>
    <text x="14" y="170" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WORT DER OBERFLÄCHE</text>
    <rect x="14" y="180" width="176" height="52" rx="6" fill="#F2AF40"/>
    <text x="22" y="212.0" font-family="'Roboto', sans-serif" font-size="15" font-weight="700" fill="#2D2926" text-anchor="start">KI-Korrektur</text>
    <text x="14" y="250" font-family="'Roboto', sans-serif" font-size="12" font-weight="400" fill="#767676" text-anchor="start">Dialog zur Einwilligung</text>
    <text x="14" y="280" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#767676" text-anchor="start">WIRKUNG</text>
    <text x="14" y="300" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Erlaubt oder verweigert die</text>
    <text x="14" y="319" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Rückmeldung. Danach</text>
    <text x="14" y="338" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">erscheint das Feedback zur</text>
    <text x="14" y="357" font-family="'Roboto', sans-serif" font-size="14" font-weight="400" fill="#2D2926" text-anchor="start">Antwort.</text>
  </g>
  <rect x="30" y="510" width="900" height="72" rx="8" fill="#B2CF42"/>
  <text x="480.0" y="540" font-family="'Roboto', sans-serif" font-size="17" font-weight="700" fill="#2D2926" text-anchor="middle">Die Wörter meinen dieselbe Funktion: Die KI gibt Rückmeldung auf Freitextantworten.</text>
  <text x="480.0" y="566" font-family="'Roboto', sans-serif" font-size="15" font-weight="400" fill="#2D2926" text-anchor="middle">"Essay Bewertung"  ·  "KI-Korrektur"  ·  "KI-Feedback"</text>
</svg>
