# Kuratierte Ansicht «Einführung für Administrator:innen» für das Administrationshandbuch.
# Gegenstück zu authoring_path_views.yaml, gleicher Generator:
#   .venv/bin/python3 bin/gen_authoring_path.py --view bin/admin_path_views.yaml [--check]
#
# Diese Datei trägt nur, was die Ansicht festlegt: Stationen, Stationstexte DE/EN, Begriffe je
# Station, die Tür «Nachlesen», Verwechslungspaare, Fussliste. Begriff, Beschreibung, Synonyme,
# Handbuchseite und tiefere Teile kommen aus der Concept Map (map.json, nur lesend).
#
# Entscheide (Yves, 30.09.2026): keine Tür «Ausprobieren» für Administrator:innen; wo kein How-to
# besteht, verweist die Nachlesen-Karte auf Support und Coaching von frentix. Kein SEB als Einstieg.

view:
  id: adminweg
  source: bin/admin_path_views.yaml
  out_dir: manual_admin/docs/admin_path
  home_page: manual_admin/docs
  home_link: ../index
  tiles_prefix: admin_path/
  # Anker des Kachelblocks auf der Einstiegsseite; #path war früher eine eigene Überschrift
  # und bleibt für bestehende Links gültig.
  tiles_id: path
  anchor: admin_path
  doors: [read]
  # Titel der Einführungsseite = Menüeintrag «Introduction for administrators» (nav_translations)
  de: Einführung für Administrator:innen
  en: Introduction for administrators
  lead_de: Fünf Stationen in der Reihenfolge, in der Sie eine neue Instanz aufbauen.
  lead_en: Five stations in the order in which you set up a new instance.
  # Phasensatz: {home} wird zur Einstiegsseite, die Anker sind die Phasenkarten dort.
  phases_de: >-
    Diese Einführung ist die Phase Wissen. Danach folgen [Anwenden]({home}#phase_apply) mit der
    Installationsanleitung oder einer fertigen Instanz von frentix und
    [Vertiefen]({home}#phase_deepen), sobald die Installation läuft.
  phases_en: >-
    This introduction is the knowledge phase. It is followed by [Apply]({home}#phase_apply) with
    the installation guide or a ready instance from frentix, and by [Deepen]({home}#phase_deepen)
    once the installation is running.
  before_de: >-
    Sie brauchen die Systemrolle Systemadministrator:in. Nur mit ihr erscheint die Administration
    in der Hauptnavigation. Wer welche Rolle bekommt, steht in der Station {rollen}.
  before_en: >-
    You need the system role System administrator. Only with it does Administration appear in the
    main navigation. Who gets which role is explained in the station {rollen}.

stations:
  - id: einrichten
    de: Einrichten
    en: Set up
    sub_de: System und Auftritt
    sub_en: System and appearance
    desc_de: >-
      Hier legen Sie fest, wie sich die Installation verhält und wie sie auftritt. In der
      Core-Konfiguration stellen Sie die Grundfunktionen ein und mit der Startseite den ersten
      Bildschirm nach dem Login, im Customizing Systemlayout, Logo und Fusszeile. Beide Bereiche
      liegen in der System-Administration:<br>`Administration > Core-Konfiguration`<br>`Administration > Customizing`
    desc_en: >-
      Here you define how the installation behaves and how it looks. In the core functions you
      configure the basic features and, with the landing page, the first screen after login; in
      customizing the system layout, logo and footer line. Both areas are in the system
      administration:<br>`Administration > Core functions`<br>`Administration > Customizing`
    items:
      - key: platform.admin_system
      - key: platform.admin_core_config
      - key: platform.admin_customizing
      - key: platform.landing_page
    read:
      path: manual_admin/docs/administration/System
      de: System
      en: System
    further:
      - manual_admin/docs/administration/Core_functions
      - manual_admin/docs/administration/Customizing
      - manual_admin/docs/administration/Landing_pages
      - reference_glossary/docs/glossary

  - id: zugang
    de: Zugang
    en: Access
    sub_de: Wer hinein darf
    sub_en: Who may enter
    desc_de: >-
      Hier entscheiden Sie, wer Ihre Installation erreicht und wie sich Personen anmelden. Die
      Authentifizierung legt die Login-Verfahren fest, die Selbstregistrierung öffnet die Instanz
      für neue Konten, der Gast sieht nur, was ausdrücklich für Gäste freigegeben ist. Der One
      Time Code ergänzt das Passwort um einen zweiten Faktor. Die Einstellungen liegen in der
      System-Administration unter:<br>`Administration > Login`
    desc_en: >-
      Here you decide who reaches your installation and how people log in. Authentication defines
      the login methods, self-registration opens the instance for new accounts, and guests only see
      what is explicitly released for guests. The one time code adds a second factor to the
      password. The settings are in the system administration under:<br>`Administration > Login`
    items:
      - key: platform.admin_login
      - key: platform.authentication
      - key: platform.self_registration
      - key: platform.guest_access
        kids: [roles.role_guest]
      - key: platform.one_time_code
    read:
      path: manual_admin/docs/administration/Login
      de: Login
      en: Login
    further:
      - manual_admin/docs/administration/Login_Password_and_Authentication
      - manual_admin/docs/administration/Login_Self-Registration
      - manual_admin/docs/administration/Guest_and_invitation
      - manual_admin/docs/administration/Login_Security
      - reference_glossary/docs/glossary

  - id: rollen
    de: Rollen
    en: Roles
    sub_de: Konten und Organisation
    sub_en: Accounts and organisation
    desc_de: >-
      In der Benutzerverwaltung, die in der Hauptnavigation steht, erstellen Sie Konten und
      weisen Rollen zu. Die Systemrolle Systemadministrator:in konfiguriert die Installation, die Organisationsrolle
      Administrator:in verwaltet die Organisation. Die Rollen Benutzerverwalter:in und
      Rollenverwalter:in teilen die Arbeit an den Konten, Autor:innen bauen Kurse. Jedes Konto
      gehört zu einer Organisation.
    desc_en: >-
      In user management, which is in the main navigation, you create accounts and assign
      roles. The system role System administrator configures the installation, the organisation role Administrator manages the
      organisation. The roles User manager and Roles manager share the work on accounts, authors
      build courses. Every account belongs to an organisation.
    items:
      - key: roles.role_sysadmin
      - key: roles.role_administrator
      - key: roles.role_usermanager
      - key: roles.role_rolesmanager
      - key: roles.role_author
      - key: platform.organisation
    read:
      path: manual_admin/docs/usermanagement/index
      de: Benutzerverwaltung
      en: User management
    further:
      - manual_admin/docs/usermanagement/Create_User
      - manual_admin/docs/usermanagement/Assign_roles
      - manual_user/docs/basic_concepts/Roles_Rights
      - manual_admin/docs/administration/Modules_Organisations
      - reference_glossary/docs/glossary

  - id: module
    de: Module
    en: Modules
    sub_de: Funktionen freischalten
    sub_en: Enable functions
    # Karten: nur Begriffe, die unter Administration > Module als Modul stehen (Menügruppe
    # modulesParent im Code). Coaching steht unter e-Assessment, Lernressource und Kurs sind als
    # Begriffe die Objekte, nicht die Module; ihre Modulseiten stehen in der Fussliste.
    desc_de: >-
      Die Grundversion von OpenOlat lässt sich mit zuschaltbaren Modulen ergänzen.
      Systemadministrator:innen aktivieren und konfigurieren die Module einzeln. Diese Station
      zeigt eine Auswahl. Alle Module stehen in der System-Administration unter:<br>`Administration > Module`
    desc_en: >-
      The basic version of OpenOlat can be extended with modules that you switch on. System
      administrators activate and configure the modules one by one. This station shows a
      selection. All modules are listed in the system administration under:<br>`Administration > Modules`
    items:
      - key: catalog.catalog
      - key: attendance.rooms_module
      - key: curriculum.course_planner
    read:
      path: manual_admin/docs/administration/Modules
      de: "Module: Übersicht"
      en: "Modules: overview"
    further:
      - manual_admin/docs/administration/Modules_Learning_Resource
      - manual_admin/docs/administration/Modules_Course
      - manual_admin/docs/administration/Modules_Catalog_2.0
      - manual_admin/docs/administration/Modules_Rooms
      - manual_admin/docs/administration/Modules_Course_Planner
      - reference_glossary/docs/glossary

  - id: anbinden
    de: Prüfen und Anbinden
    en: Assess and connect
    sub_de: Prüfungen und externe Werkzeuge
    sub_en: Exams and external tools
    desc_de: >-
      Die Prüfungsverwaltung legt fest, wie Prüfungen ablaufen, der Safe Exam Browser sichert
      sie ab. Unter den externen Werkzeugen schalten Sie mit dem KI-Modul die KI-Funktionen frei
      und verbinden über LTI Kurse mit externen Anwendungen. Die REST API öffnet OpenOlat für
      andere Systeme. Alle drei Bereiche liegen in der System-Administration:<br>`Administration > e-Assessment > Prüfungsverwaltung`<br>`Administration > Externe Werkzeuge`<br>`Administration > Core-Konfiguration > REST API`
    desc_en: >-
      Assessment management defines how exams run, the Safe Exam Browser secures them. Among the
      external tools you enable the AI features with the AI module and connect courses to external
      applications via LTI. The REST API opens OpenOlat to other systems. All three areas are in
      the system administration:<br>`Administration > e-Assessment > Assessment management`<br>`Administration > External tools`<br>`Administration > Core functions > REST API`
    items:
      - key: assessment.assessment_management
      - key: assessment.safe_exam_browser
      - key: ai.ai_module
      - key: integrations.lti
      - key: integrations.rest_api
    read:
      path: manual_admin/docs/administration/External_Tools_-_Administration
      de: "Externe Werkzeuge: Übersicht"
      en: "External tools: overview"
    further:
      - manual_admin/docs/administration/e-Assessment_Administration
      - manual_admin/docs/administration/e-Assessment_AssessmentMgmt
      - manual_admin/docs/administration/External_Tools_AI
      - manual_admin/docs/administration/LTI_Integrations
      - manual_admin/docs/administration/REST_API
      - manual_admin/docs/administration/Life_cycles_-_Administration
      - manual_admin/docs/administration/Reports
      - reference_glossary/docs/glossary

# Verwechslungspaare, nur mit keep_apart-Kante in der Map.
apart:
  - [platform.guest_access, roles.role_guest]
  - [platform.one_time_code, platform.passkey]
  - [assessment.assessment_management, assessment.assessment_tool]
  - [attendance.rooms_module, attendance.room_management]
  - [curriculum.course_planner, platform.area_courseplanner]

