# Kuratierte Ansicht «Einführung für Administrator:innen» für das Administrationshandbuch.
# Gegenstück zu authoring_path_views.yaml, gleicher Generator:
#   .venv/bin/python3 bin/gen_authoring_path.py --view bin/admin_path_views.yaml [--check]
#
# Diese Datei trägt nur, was die Ansicht festlegt: Stationen, Stationstexte DE/EN, Begriffe je
# Station, die Tür «Nachlesen», Verwechslungspaare, Fussliste. Begriff, Beschreibung, Synonyme,
# Handbuchseite und tiefere Teile kommen aus der Concept Map (map.json, nur lesend).
#
# Entscheide (Yves, 30.09.2026): keine Tür «Ausprobieren» für Administrator:innen; wo kein How-to
# besteht, verweist die Nachlesen-Karte auf Support und Coaching von frentix. Kein SEB als Einstieg.

view:
  id: adminweg
  source: bin/admin_path_views.yaml
  out_dir: manual_admin/docs/admin_path
  home_page: manual_admin/docs
  home_link: ../index
  tiles_prefix: admin_path/
  # Anker des Kachelblocks auf der Einstiegsseite; #path war früher eine eigene Überschrift
  # und bleibt für bestehende Links gültig.
  tiles_id: path
  anchor: admin_path
  doors: [read]
  # Titel der Einführungsseite = Menüeintrag «Introduction for administrators» (nav_translations)
  de: Einführung für Administrator:innen
  en: Introduction for administrators
  lead_de: Fünf Stationen zeigen, was Sie vor dem Start einer Installation verstehen und entscheiden.
  lead_en: Five stations show what you understand and decide before you start an installation.
  # Phasensatz: {home} wird zur Einstiegsseite, die Anker sind die Phasenkarten dort.
  phases_de: >-
    Diese Einführung ist die Phase Wissen. Danach folgen [Anwenden]({home}#phase_apply) mit der
    Installationsanleitung oder einer fertigen Instanz von frentix und
    [Vertiefen]({home}#phase_deepen), sobald die Installation läuft.
  phases_en: >-
    This introduction is the knowledge phase. It is followed by [Apply]({home}#phase_apply) with
    the installation guide or a ready instance from frentix, and by [Deepen]({home}#phase_deepen)
    once the installation is running.
  before_de: >-
    Sie brauchen die Systemrolle Systemadministrator:in. Nur mit ihr erscheint die Administration
    in der Hauptnavigation. Wer welche Rolle bekommt, steht in der Station {rollen}.
  before_en: >-
    You need the system role System administrator. Only with it does Administration appear in the
    main navigation. Who gets which role is explained in the station {rollen}.

stations:
  # Stationstexte: was vor dem Start zu verstehen und zu entscheiden ist (Testbefund OODOC-680,
  # 22.10.2026). Der Menüpfad steht in menu_de/menu_en und erscheint unter «Nachlesen».
  - id: einrichten
    de: System
    en: System
    sub_de: Betrieb und Auftritt
    sub_en: Operation and appearance
    desc_de: >-
      Vor dem Start klären Sie, wer die Installation betreibt, Ihre Organisation selbst oder ein
      Anbieter wie frentix, und wie sie auftreten soll. Die Core-Konfiguration legt die Grundfunktionen fest, die
      Startseite den ersten Bildschirm nach dem Login und das Customizing Systemlayout, Logo und
      Fusszeile.
    desc_en: >-
      Before you start, you clarify who operates the installation, your organisation itself or a
      provider such as frentix, and how it should look. The core functions define the basic features, the landing
      page the first screen after login, and customizing the system layout, logo and footer line.
    menu_de: >-
      Nach der Installation stehen die Einstellungen in der System-Administration unter:<br>`Administration > Core-Konfiguration`<br>`Administration > Customizing`
    menu_en: >-
      After the installation, the settings are in the system administration under:<br>`Administration > Core functions`<br>`Administration > Customizing`
    items:
      - key: platform.admin_system
      - key: platform.admin_core_config
      - key: platform.admin_customizing
      - key: platform.landing_page
    read:
      path: manual_admin/docs/administration/System
      de: System
      en: System
    further:
      - manual_admin/docs/administration/Core_functions
      - manual_admin/docs/administration/Customizing
      - manual_admin/docs/administration/Landing_pages
      - reference_glossary/docs/glossary

  - id: zugang
    de: Zugang
    en: Access
    sub_de: Wer hinein darf
    sub_en: Who may enter
    desc_de: >-
      Vor dem Start entscheiden Sie, wer Ihre Installation erreicht und wie sich Personen anmelden.
      Die Authentifizierung legt die Login-Verfahren fest. Mit der Selbstregistrierung legen
      Personen ihr Konto selbst an, der Gast sieht nur, was ausdrücklich für Gäste freigegeben ist.
      Der One Time Code ergänzt das Passwort um einen zweiten Faktor.
    desc_en: >-
      Before you start, you decide who reaches your installation and how people log in.
      Authentication defines the login methods. With self-registration, people create their
      account themselves, and guests only see what is explicitly released for guests. The one time
      code adds a second factor to the password.
    menu_de: >-
      Nach der Installation stehen die Einstellungen in der System-Administration unter:<br>`Administration > Login`
    menu_en: >-
      After the installation, the settings are in the system administration under:<br>`Administration > Login`
    items:
      - key: platform.admin_login
      - key: platform.authentication
      - key: platform.self_registration
      - key: platform.guest_access
        kids: [roles.role_guest]
      - key: platform.one_time_code
    read:
      path: manual_admin/docs/administration/Login
      de: Login
      en: Login
    further:
      - manual_admin/docs/administration/Login_Password_and_Authentication
      - manual_admin/docs/administration/Login_Self-Registration
      - manual_admin/docs/administration/Guest_and_invitation
      - manual_admin/docs/administration/Login_Security
      - reference_glossary/docs/glossary

  - id: rollen
    de: Rollen
    en: Roles
    sub_de: Konten und Organisation
    sub_en: Accounts and organisation
    desc_de: >-
      Vor dem Start klären Sie, wie Ihre Organisation aufgebaut ist und wer welche Rolle bekommt.
      Jedes Konto gehört zu einer Organisation. Die Systemrolle Systemadministrator:in konfiguriert
      die Installation, die Organisationsrolle Administrator:in verwaltet die Organisation. Die
      Rollen Benutzerverwalter:in und Rollenverwalter:in teilen die Arbeit an den Konten,
      Autor:innen bauen Kurse.
    desc_en: >-
      Before you start, you clarify how your organisation is structured and who gets which role.
      Every account belongs to an organisation. The system role System administrator configures
      the installation, the organisation role Administrator manages the organisation. The roles
      User manager and Roles manager share the work on accounts, authors build courses.
    menu_de: >-
      Nach der Installation erstellen Sie Konten und weisen Rollen in der Benutzerverwaltung zu. Sie steht in der Hauptnavigation.
    menu_en: >-
      After the installation, you create accounts and assign roles in user management. It is in the main navigation.
    items:
      - key: roles.role_sysadmin
      - key: roles.role_administrator
      - key: roles.role_usermanager
      - key: roles.role_rolesmanager
      - key: roles.role_author
      - key: platform.organisation
    read:
      path: manual_admin/docs/usermanagement/index
      de: Benutzerverwaltung
      en: User management
    further:
      - manual_admin/docs/usermanagement/Create_User
      - manual_admin/docs/usermanagement/Assign_roles
      - manual_user/docs/basic_concepts/Roles_Rights
      - manual_admin/docs/administration/Modules_Organisations
      - reference_glossary/docs/glossary

  - id: module
    de: Module
    en: Modules
    sub_de: Welche Funktionen Sie brauchen
    sub_en: Which functions you need
    # Karten: nur Begriffe, die unter Administration > Module als Modul stehen (Menügruppe
    # modulesParent im Code). Coaching steht unter e-Assessment, Lernressource und Kurs sind als
    # Begriffe die Objekte, nicht die Module; ihre Modulseiten stehen in der Fussliste.
    desc_de: >-
      Die Grundversion von OpenOlat lässt sich mit zuschaltbaren Modulen ergänzen. Ohne das
      passende Modul erscheint eine Funktion nicht. Vor dem Start klären Sie deshalb, welche
      Funktionen Ihre Organisation braucht, zum Beispiel den Katalog, die Räume oder den Course
      Planner. Diese Station zeigt eine Auswahl.
    desc_en: >-
      The basic version of OpenOlat can be extended with modules that you switch on. Without the
      matching module, a function does not appear. Before you start, you therefore clarify which
      functions your organisation needs, for example the catalog, the rooms or the Course Planner.
      This station shows a selection.
    menu_de: >-
      Nach der Installation aktivieren und konfigurieren Systemadministrator:innen die Module einzeln. Alle Module stehen in der System-Administration unter:<br>`Administration > Module`
    menu_en: >-
      After the installation, system administrators activate and configure the modules one by one. All modules are listed in the system administration under:<br>`Administration > Modules`
    items:
      - key: catalog.catalog
      - key: attendance.rooms_module
      - key: curriculum.course_planner
    read:
      path: manual_admin/docs/administration/Modules
      de: "Module: Übersicht"
      en: "Modules: overview"
    further:
      - manual_admin/docs/administration/Modules_Learning_Resource
      - manual_admin/docs/administration/Modules_Course
      - manual_admin/docs/administration/Modules_Catalog_2.0
      - manual_admin/docs/administration/Modules_Rooms
      - manual_admin/docs/administration/Modules_Course_Planner
      - reference_glossary/docs/glossary

  - id: anbinden
    de: Prüfen und Anbinden
    en: Assess and connect
    sub_de: Prüfungen und externe Werkzeuge
    sub_en: Exams and external tools
    desc_de: >-
      Vor dem Start klären Sie, ob Sie in OpenOlat Prüfungen durchführen und welche anderen
      Systeme Sie anbinden. Die Prüfungsverwaltung legt fest, wie Prüfungen ablaufen, der Safe
      Exam Browser sichert sie ab. Das KI-Modul schaltet die KI-Funktionen frei, LTI verbindet
      Kurse mit externen Anwendungen und die REST API öffnet OpenOlat für andere Systeme.
    desc_en: >-
      Before you start, you clarify whether you run exams in OpenOlat and which other systems you
      connect. Assessment management defines how exams run, the Safe Exam Browser secures them.
      The AI module enables the AI features, LTI connects courses to external applications and the
      REST API opens OpenOlat to other systems.
    menu_de: >-
      Nach der Installation stehen die Einstellungen in der System-Administration unter:<br>`Administration > e-Assessment > Prüfungsverwaltung`<br>`Administration > Externe Werkzeuge`<br>`Administration > Core-Konfiguration > REST API`
    menu_en: >-
      After the installation, the settings are in the system administration under:<br>`Administration > e-Assessment > Assessment management`<br>`Administration > External tools`<br>`Administration > Core functions > REST API`
    items:
      - key: assessment.assessment_management
      - key: assessment.safe_exam_browser
      - key: ai.ai_module
      - key: integrations.lti
      - key: integrations.rest_api
    read:
      path: manual_admin/docs/administration/External_Tools_-_Administration
      de: "Externe Werkzeuge: Übersicht"
      en: "External tools: overview"
    further:
      - manual_admin/docs/administration/e-Assessment_Administration
      - manual_admin/docs/administration/e-Assessment_AssessmentMgmt
      - manual_admin/docs/administration/External_Tools_AI
      - manual_admin/docs/administration/LTI_Integrations
      - manual_admin/docs/administration/REST_API
      - manual_admin/docs/administration/Life_cycles_-_Administration
      - manual_admin/docs/administration/Reports
      - reference_glossary/docs/glossary

# Verwechslungspaare, nur mit keep_apart-Kante in der Map.
apart:
  - [platform.guest_access, roles.role_guest]
  - [platform.one_time_code, platform.passkey]
  - [assessment.assessment_management, assessment.assessment_tool]
  - [attendance.rooms_module, attendance.room_management]
  - [curriculum.course_planner, platform.area_courseplanner]

